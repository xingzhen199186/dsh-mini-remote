# 租户 ${TENANT_ID} 的 frp 控制入口。只代理到本机回环。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${CONTROL_HOST};

    ssl_certificate     /etc/letsencrypt/live/${CONTROL_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${CONTROL_HOST}/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:${CONTROL_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
