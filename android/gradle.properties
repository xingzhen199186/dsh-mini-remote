# 安卓代码本身只用 android.jar 与 Java 标准库；唯一用到 AndroidX 的是扫码库的
# ContextCompat（见 app/build.gradle.kts 里的 androidx.core）。
android.useAndroidX=true

# 固定构建进程内存与源码编码，避免中文注释受本机默认编码影响。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 本机工作区在中文路径下。AGP 的路径检查是保守警告：这个工程只用 javac 与 aapt2，
# 两者在 UTF-8 路径下可用（2026-11-05 实测能出包）。换到纯 ASCII 路径也可以，这一行就不必留。
android.overridePathCheck=true
