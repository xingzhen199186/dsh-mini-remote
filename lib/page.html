<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DSH mini remote</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --fg: #e8eaed;
    --muted: #8b93a1;
    --accent: #4c8dff;
    --ok: #35c46b;
    --warn: #e0a33a;
    --err: #e5604d;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  /* ---------- 顶栏 ---------- */
  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 600; letter-spacing: .3px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex: 0 0 auto; transition: background .2s;
  }
  .dot.ok { background: var(--ok); }
  .dot.run { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
  .dot.err { background: var(--err); }
  @keyframes pulse { 50% { opacity: .25; } }
  .status { color: var(--muted); font-size: 13px; flex: 1 1 auto;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn {
    flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
    font-size: 16px; display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { transform: scale(.94); }

  /* ---------- 显示区 ---------- */
  main { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 14px; }
  main.center { display: grid; place-items: center; }

  #reply {
    white-space: pre-wrap; word-break: break-word;
    font-size: 16px; line-height: 1.75;
  }
  #reply a { color: var(--accent); }
  .placeholder { color: var(--muted); font-size: 15px; text-align: center; line-height: 1.9; }
  .placeholder kbd {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 1px 6px; font-size: 13px; font-family: inherit;
  }

  /* ---------- 聊天模式 ---------- */
  /* width: fit-content 是关键，别删。
     气泡是个块级元素，而块级元素的宽度默认是「撑满容器」——只写 max-width 的话，
     那只是给它封了个顶，短消息（「好的」「继续」）照样会撑成一个 86% 宽的大方块，
     右边留一大片空白。fit-content 让它按内容收：短的自适应，长的到 86% 就折行。
     两种气泡都要，只改一边的话，短回复那边还是会露出大方块，看着像坏了。 */
  .bubble {
    width: fit-content;
    max-width: 86%; padding: 10px 13px; border-radius: var(--radius);
    /* 18px，和 .said 的下边距一致。原来是 10px，用户 2026-09-22 实机提「指令气泡和
       回答正文第一行之间贴得太紧」——10px 是「同一条消息内部」的距离，
       而这里跨的是「我说的话」和「它答的话」，是更大的一个断点，该给更多。 */
    margin-bottom: 18px; white-space: pre-wrap; word-break: break-word;
    font-size: 15.5px; line-height: 1.7;
  }
  .bubble.user { margin-left: auto; background: var(--panel-2); border: 1px solid var(--line); }
  .bubble.assistant { margin-right: auto; background: var(--panel); border: 1px solid var(--line); }
  .bubble a { color: var(--accent); }
  .bubble .meta { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); }
  /* 「已停止」标签：被按停的那一轮，手机上收到的只是**已经吐出来的那半句**。
     不标出来的话，它看着就像模型答崩了。 */
  .stopped {
    display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px;
    color: var(--muted); border: 1px solid var(--line); vertical-align: middle;
  }
  .reply-bar .stopped { margin-right: auto; }
  /* ---------- Markdown 正文 ---------- */
  /* 外层是 pre-wrap（用户消息和旧内容靠它），markdown 输出的是真块级元素，
     所以要在这里把 pre-wrap 收掉，否则段落之间会多出一堆空行。 */
  .md { white-space: normal; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 .7em; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
    margin: 1em 0 .5em; line-height: 1.35; font-weight: 650;
  }
  .md h1 { font-size: 1.35em; }
  .md h2 { font-size: 1.22em; }
  .md h3 { font-size: 1.1em; }
  .md h4, .md h5, .md h6 { font-size: 1em; }
  .md ul, .md ol { margin: 0 0 .7em; padding-left: 1.4em; }
  .md li { margin: .18em 0; }
  .md a { color: var(--accent); word-break: break-all; }
  .md strong { font-weight: 650; }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 1em 0; }
  .md blockquote {
    margin: 0 0 .7em; padding: .1em 0 .1em .8em;
    border-left: 3px solid var(--line); color: var(--muted);
  }
  .md code {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px;
    padding: .1em .35em; font-size: .88em;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .md .code {
    margin: 0 0 .7em; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel-2); overflow: hidden;
  }
  .md .code-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 5px 8px 5px 10px; border-bottom: 1px solid var(--line);
  }
  .md .code-head .lang { font-size: 11px; color: var(--muted); }
  .md .code pre { margin: 0; padding: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .md .code code {
    background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.6;
    white-space: pre;
  }
  /* 表格窄屏放不下就横向滚，别把页面撑破 */
  .md table { border-collapse: collapse; margin: 0 0 .7em; font-size: .92em; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; white-space: nowrap; }
  .md th { background: var(--panel-2); font-weight: 600; }

  /* 复制按钮：方形的图标按钮，图标是两个重叠的方框（就是常见那个复制图标）。
     点下去换成对勾，1.4 秒后自己变回来——手机上没法悬停，也没有「已复制」的
     系统提示，这个反馈是唯一的，所以必须有。
     三个地方共用：单帧模式的整篇、聊天模式的气泡、代码块。 */
  .copy {
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; padding: 0; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
  }
  .copy svg {
    width: 15px; height: 15px; fill: none; stroke: currentColor;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }
  .copy:active { transform: scale(.95); }
  .copy.done { color: var(--accent); border-color: var(--accent); }
  .bubble .meta .copy { margin-left: 8px; vertical-align: middle; }
  /* 上面那条只放「已停止」标签——它是给正文打的预防针，得在正文之前出现。
     复制按钮挪到正文下面去了（.reply-foot）。 */
  .reply-bar { display: flex; justify-content: flex-start; margin-bottom: 8px; }
  /* 复制按钮在正文下方、靠左——用户要求。原来在上面靠右，拇指够不着，
     而且会比正文先入眼。 */
  .reply-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .reply-foot .time { font-size: 11.5px; color: var(--muted); }
  /* 聊天模式下 AI 的回答**不套气泡**（用户要求「参考单帧模式那样」）。
     用户自己的指令仍然是气泡，一左一右、一个有框一个没框，正好分得清谁说的。 */
  .said { margin-bottom: 18px; }
  /* ---------- 正在流出来的那一段 ---------- */
  /* 和最终答案**刻意画得不一样**：上面一条虚线、末尾一个闪动的竖条、没有复制按钮。
     三样都在说同一句话——「这不是最终答案，还会变」。等答案落定整块被换掉。 */
  .live {
    margin-top: 18px; padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  .live .md > *:last-child::after {
    content: ''; display: inline-block; width: 2px; height: 1em;
    margin-left: 2px; vertical-align: -2px;
    background: var(--accent, #2563eb);
    animation: caret 1s steps(2, start) infinite;
  }
  @keyframes caret { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  /* ---------- 「正在执行」：鲸鱼娘 + 进度条 + 气泡 ----------
     单帧模式下它出现在上一条回答的**下方**，不顶掉它，所以要用虚线跟正文分开，
     不然会被当成那条回答的一部分。 */
  .work {
    margin-top: 20px; padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  /* 立绘和气泡是**一组**。这里把两件事拆开：
       立绘站哪儿 → 由**这一行的宽度**决定，跟词条无关；
       气泡多宽   → 由词条自己的长短决定。
     行宽取「最长那句」的整组宽度，再把这一行居中，于是立绘永远站在同一个位置。
     算账：立绘 122 + 间隙 6 + 最长那句的气泡 171 = 299。
     那个 171 = 10 个全角字 × 14.5px，加左右内边距 24、边框 2。
     用 max-content 而不是写死 width：将来真加了更长的词条，这行会自己撑开——
     宁可立绘挪一点，也不能让字顶出屏幕。
     min() 是窄屏退路：屏幕比 299 还窄时，这行跟着屏幕收，别溢出。 */
  .work-top {
    display: flex; align-items: center; gap: 6px;
    width: max-content; min-width: min(299px, 100%);
    margin: 0 auto;
  }

  /* 立绘：每个姿势是一张「两帧并排」的雪碧图（760×330），靠 background-position
     在左右两帧之间硬切，手脚就真的在动——不是把一张静图晃一晃。
     七层叠在一起，换姿势时交叉淡入。 */
  .work-stage {
    position: relative; flex: 0 0 auto;
    width: 122px; height: 106px;
    /* 整块再轻轻浮动一下。它的节奏和翻帧错开，两下叠起来才像活的。 */
    animation: workBob 2.4s ease-in-out infinite;
  }
  @keyframes workBob { 50% { transform: translateY(-3px); } }
  .pose {
    position: absolute; inset: 0;
    background-repeat: no-repeat;
    background-position: 0 0;
    background-size: 244px 106px;   /* 两帧并排的显示宽度 = 122 × 2 */
    opacity: 0; transition: opacity .35s ease;
    animation-name: poseFlip;
    animation-timing-function: step-end;
    animation-iteration-count: infinite;
    animation-play-state: paused;   /* 没轮到它的层就别动，省电 */
  }
  .pose.on { opacity: 1; animation-play-state: running; }
  /* 前半段左帧、后半段右帧。49.9%→50% 那一下是硬切、不插值，
     不然会看到两张图横向滑过去。 */
  @keyframes poseFlip {
    0%, 49.9% { background-position: 0 0; }
    50%, 100% { background-position: -122px 0; }
  }

  /* 气泡：左边一个小尖角指向立绘。
     宽度**贴着自己的词条**，多长就多宽，右边不留空。
     它推不动立绘——立绘的位置由上面 .work-top 的固定行宽管着，跟气泡宽窄无关。
     所以「词条每 3.6 秒换一次」这件事不会让立绘左右晃。
     max-width 是窄屏退路：立绘 122 + 间隙 6，剩下的都给气泡，宁可折行也别顶出屏幕。
     抬到 flex-start 是让尖角对着她的头，而不是对着身子中间。 */
  .work-bubble {
    position: relative; flex: 0 1 auto;
    max-width: calc(100% - 128px);
    align-self: flex-start; margin-top: 6px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 9px 12px;
    font-size: 14.5px; line-height: 1.5; color: var(--fg);
  }
  .work-bubble::before, .work-bubble::after {
    content: ''; position: absolute; top: 50%; width: 0; height: 0;
    border: 6px solid transparent; margin-top: -6px;
  }
  .work-bubble::before { left: -12px; border-right-color: var(--line); }
  .work-bubble::after { left: -11px; border-right-color: var(--panel-2); }

  /* 进度条故意做成**不确定进度**的流动条，不是百分比。
     插件按设计只收「指令 + 最终回复」，拿不到 Agent 此刻跑到哪一步，
     所以画一个填到 80% 的假进度条等于撒谎。它只表达「在跑」，不表达「跑到哪了」。 */
  .work-progress {
    margin-top: 10px; height: 4px; border-radius: 2px;
    background: var(--panel-2); overflow: hidden;
  }
  .work-progress i {
    display: block; width: 38%; height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--accent) 45%, var(--accent) 55%, transparent);
    animation: workSweep 1.5s ease-in-out infinite;
  }
  @keyframes workSweep {
    from { transform: translateX(-105%); }
    to { transform: translateX(265%); }
  }
  /* 秒数在左、停止按钮在右。秒数原来是自己一行右对齐，现在跟按钮同一行。 */
  .work-foot {
    margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .work-elapsed {
    color: var(--muted); font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  /* 停止按钮。做成描边而不是实心：它是个「打断」，不该比「发送」还显眼。
     按下去之后自己禁用并改文案——cancel() 只是递请求，真正停下要等状态翻，
     这中间必须让用户看见「已经按到了」，否则会连按好几下。 */
  .stop {
    padding: 5px 14px; border-radius: 999px; font-size: 13px;
    border: 1px solid var(--line); background: transparent; color: var(--fg);
    transition: opacity .15s;
  }
  .stop:disabled { opacity: .5; }

  /* 排队中的指令。跑着任务时接着发的那几条排在这儿，等这一轮跑完再跑。
     单帧模式下你发出去的那句话在别处一个字都看不见（那一模式只显示回复），
     所以这块是唯一的反馈，不能省。 */
  .queue {
    margin-top: 12px; padding: 8px 10px; border-radius: 10px;
    background: var(--panel-2); border: 1px solid var(--line);
  }
  .queue .q-head { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
  .queue .q-row {
    display: flex; align-items: center; gap: 8px; padding: 3px 0;
    font-size: 13.5px; line-height: 1.45;
  }
  /* 长指令折行，但最多两行——队列是「提醒还有几条」，不是给人重读全文的地方。 */
  .queue .q-text {
    flex: 1 1 auto; min-width: 0; color: var(--fg);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .queue .q-drop {
    flex: 0 0 auto; width: 24px; height: 24px; padding: 0; line-height: 1;
    border-radius: 999px; font-size: 12px;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
  }

  /* 系统里设了「减少动态效果」的人：不浮动、不翻帧、不轮播、进度条常亮。
     秒数照常走——那是信息，不是装饰。 */
  @media (prefers-reduced-motion: reduce) {
    .work-stage { animation: none; }
    .pose { animation: none; transition: none; }
    .work-progress i { animation: none; width: 100%; opacity: .45; }
  }

  /* ---------- 底栏 ---------- */
  footer {
    flex: 0 0 auto; display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
    background: var(--panel); border-top: 1px solid var(--line);
  }
  #input {
    flex: 1 1 auto; resize: none; min-height: 42px; max-height: 140px;
    padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--fg); font: inherit; font-size: 16px;
    line-height: 1.5; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  .send {
    flex: 0 0 auto; height: 42px; padding: 0 16px; border-radius: 12px;
    border: none; background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .send:disabled { opacity: .4; }

  /* ---------- 上传附件 ---------- */
  .attach {
    flex: 0 0 auto; width: 42px; height: 42px; padding: 0; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .attach svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .attach:disabled { opacity: .4; }
  /* 上传中：图标转起来。这条路上没有进度条，至少要让人看出「它在动」。 */
  .attach.busy svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 附件小条：排在输入框上面，让你发之前看得见自己带了什么。 */
  .attach-bar {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px;
    padding: 8px 12px 0; background: var(--panel); border-top: 1px solid var(--line);
  }
  .attach-bar[hidden] { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    padding: 5px 6px 5px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel-2);
    font-size: 12.5px; color: var(--fg);
  }
  .chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 42vw; }
  .chip .sz { color: var(--muted); flex: none; }
  .chip .x {
    flex: none; width: 20px; height: 20px; padding: 0; border-radius: 50%;
    border: none; background: transparent; color: var(--muted);
    font-size: 15px; line-height: 1; cursor: pointer;
  }
  .chip.failed { border-color: var(--danger, #dc2626); }

  /* ---------- 左侧导航栏 ---------- */
  #nav {
    position: fixed; inset: 0; z-index: 60; display: none;
    background: rgba(0, 0, 0, .5);
  }
  #nav.open { display: block; }
  .nav-panel {
    position: absolute; top: 0; bottom: 0; left: 0; width: min(86vw, 350px);
    display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    animation: navIn .18s ease-out;
  }
  @keyframes navIn { from { transform: translateX(-100%); } }
  .nav-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--line);
    font-weight: 600;
  }
  .nav-head > span:first-child { flex: 1 1 auto; }
  .nav-body { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .nav-body .placeholder { padding: 24px 16px; font-size: 14px; }

  .ws { border-bottom: 1px solid var(--line); }
  .ws-head {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 12px 14px; background: none; border: none; color: var(--fg);
    font: inherit; font-size: 14.5px; text-align: left; cursor: pointer;
  }
  .ws-head .caret {
    flex: 0 0 auto; color: var(--muted); font-size: 10px;
    transition: transform .15s;
  }
  .ws.open .ws-head .caret { transform: rotate(90deg); }
  .ws-head .ws-title { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-head .ws-count { flex: 0 0 auto; color: var(--muted); font-size: 12px; }

  .sess .s-title { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .s-meta { flex: 0 0 auto; color: var(--muted); font-size: 11.5px; }
  .sess .s-dot, .ws-head .s-dot {
    flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%;

  }
  /* 「新建会话」那一行。跟会话条目同宽、同缩进，但用强调色——
     它不是一个会话，是一个动作。长得跟会话一样会让人以为点进去就是那条会话。 */
  .ws-new {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 10px 14px 10px 30px; background: none; border: none;
    color: var(--accent); font: inherit; font-size: 14px; text-align: left; cursor: pointer;
  }
  .ws-new:active { background: var(--panel-2); }
  .ws-new[disabled] { color: var(--muted); cursor: default; }

  /* 导航栏最上面那条「新建工作区」。跟工作区条目之间用一条线隔开：
     它是这一屏的入口，不是一个工作区。 */
  .nav-cta {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 12px 14px; background: none; border: none; border-bottom: 1px solid var(--line);
    color: var(--accent); font: inherit; font-size: 14px; text-align: left; cursor: pointer;
  }
  .nav-cta:active { background: var(--panel-2); }

  /* 面包屑。横向能划，路径再深也不会把面板撑破。 */
  .crumb {
    display: flex; align-items: center; gap: 2px; padding: 8px 10px;
    overflow-x: auto; white-space: nowrap; border-bottom: 1px solid var(--line);
  }
  .crumb button {
    background: none; border: none; color: var(--accent); font: inherit;
    font-size: 13px; padding: 4px 6px; cursor: pointer; border-radius: 6px;
  }
  .crumb button:active { background: var(--panel-2); }
  .crumb .sep { color: var(--muted); font-size: 12px; }
  .crumb .here { color: var(--fg); font-size: 13px; padding: 4px 6px; }

  /* 「就选这个目录」——这一屏唯一的主按钮，所以给它实心底。 */
  .pick-here {
    display: block; width: calc(100% - 24px); margin: 10px 12px;

  .pick-here[disabled] { background: var(--line); color: var(--muted); cursor: default; }

  /* 新建文件夹那一行输入。内联而不是 window.prompt：prompt 在微信这类内嵌
     浏览器里会被直接屏蔽，那时候点「新建文件夹」什么都不发生、也没提示。 */
  .mkdir-row { display: flex; gap: 6px; padding: 8px 12px; align-items: center; }

  .mkdir-row button:active { background: var(--line); }

  /* 「完全权限」那一档的待确认状态：点一次先变成这样，再点一次才真切。
     跟 .active（当前所在档位）用不同颜色区分——一个是「将要去」，一个是「已在」。 */
  .seg button.armed { background: var(--danger, #c0392b); color: #fff; }
  .nav-note { padding: 10px 16px; color: var(--muted); font-size: 12px; line-height: 1.6; }

  /* ---------- 设置抽屉 ---------- */
  #settings {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: flex-end; z-index: 50;
  }
  #settings.open { display: flex; }
  .sheet {
    width: 100%; max-height: 86vh; overflow-y: auto;
    background: var(--panel); border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px);

  .sheet h2 { margin: 0 0 14px; font-size: 16px; }
  .row {

  }
  .row:last-of-type { border-bottom: none; }
  .row .label { font-size: 15px; }
  .row .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
  /* flex-shrink: 0 不能省。它是弹性项，左边的说明文字一长就会被压缩；
     而它自己带着 overflow: hidden，所以被压掉的那一段不是跑到屏幕外，是**被裁掉**——
     2026-09-25 用户截图里那个「关」字就是这么没的。 */
  .seg { display: flex; flex-shrink: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button {
    padding: 7px 12px; border: none; background: var(--panel-2); color: var(--muted);
    font-size: 13px; cursor: pointer;
  }
  .seg button.active { background: var(--accent); color: #fff; }
  select, .btn {
    padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--fg); font: inherit; font-size: 14px;
  }
  .btn { cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .sheet .foot { margin-top: 18px; display: flex; gap: 10px; }
  .sheet .foot .btn { flex: 1 1 0; text-align: center; }

  /* ---------- token 输入 ---------- */
  #gate { position: fixed; inset: 0; background: var(--bg); z-index: 100;
          display: none; flex-direction: column; justify-content: center;
          padding: 24px; gap: 14px; }
  #gate.open { display: flex; }
  #gate h1 { font-size: 20px; margin: 0; }
  #gate p { color: var(--muted); font-size: 14px; margin: 0; }
  #gate input {
    padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--fg); font: inherit; font-size: 16px;
  }
  #gate button {
    padding: 13px; border-radius: 12px; border: none; background: var(--accent);
    color: #fff; font-size: 16px; font-weight: 600;
  }
  #gate .err { color: var(--err); font-size: 13px; min-height: 18px; }

  #toast {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(8px);
    background: rgba(40,44,54,.97); color: var(--fg); padding: 9px 16px;
    border-radius: 20px; font-size: 13.5px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 200; max-width: 86vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <button class="icon-btn" id="btnNav" aria-label="工作区与会话">☰</button>
  <span class="dot" id="dot"></span>
  <span class="brand">DSH mini remote</span>
  <span class="status" id="status">连接中…</span>
  <button class="icon-btn" id="btnSettings" aria-label="设置">⚙</button>
</header>

<!-- 模型与思考强度（2026-09-25 用户要求：手机上要能改每个会话的模型和强度）。

     这一步只做**显示**，不做修改：先把真数据摆出来、确认显示得对、确认刷新跟得上，
     再把按钮加上去。顺序是故意的——不做「点了没用」的东西。

     **整段是自包含的**：自己的 script 标签、自己的请求、自己的元素，不碰页面现有的
     任何代码。唯一的对外依赖是 /mini/api/models 那条接口（已经验过真数据）。
     这样即使这段整个坏掉，也不会影响已经能用的部分。

     没拿到数据之前整条藏着——**宁可什么都不显示，也不显示一个占位的假值**。 -->
<div id="modelBar" style="display:none;align-items:center;gap:8px;padding:6px 12px;font-size:12px;color:var(--dim,#888);border-bottom:1px solid var(--line,#e5e5e5)">
  <span id="modelBarText"></span>
</div>
<!-- 这一段暂时**不执行**（标成非脚本），是有意的停手，不是忘了接上：
     这个页面被设计成**只有一个脚本块**——测试钉住了这一条，因为抽取脚本的正则
     是贪婪匹配，多一个块就会把中间的 HTML 整段当成 JS 去解析（这次就是这么炸的）。
     另外**别在这段注释里写出那个标签的尖括号原文**：测试的正则只认字面量，
     注释里的它照样会被当成脚本开头，一样会把中间的东西吃进去。
     所以这段代码要挪进上面那个唯一的 script 里才会生效。代码本身没问题，
     /mini/api/models 也验过真数据了。 -->
<template id="modelBarCode">
(function () {
  var bar = document.getElementById('modelBar')
  var text = document.getElementById('modelBarText')
  if (!bar || !text) return

  // token：页面本来就是带着它打开的，直接沿用，不让用户再输一次。
  function token() {
    try {
      var q = new URLSearchParams(location.search).get('token')
      if (q) return q
    } catch (e) { /* 老浏览器没有 URLSearchParams，走下面 */ }
    var m = location.search.match(/[?&]token=([^&]+)/)
    return m ? decodeURIComponent(m[1]) : ''
  }

  function show(selection) {
    if (!selection || !selection.model) { bar.style.display = 'none'; return }
    var parts = []
    if (selection.provider) {
      // 来源名用 DSH 给的那个（「DeepSeek」「opencode go」「mimo」），不是内部 id
      parts.push(selection.provider)
    }
    parts.push(selection.model)
    if (selection.reasoningEffort) parts.push('思考 ' + selection.reasoningEffort)
    text.textContent = '📦 ' + parts.join(' · ')
    bar.style.display = 'flex'
  }

  function load() {
    var t = token()
    if (!t) return
    fetch('/mini/api/models?token=' + encodeURIComponent(t), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null })
      .then(function (d) {
        if (!d || !d.ok) return
        // 来源名要拿 id→name 的映射换一下，DSH 给的是内部 id（opencode-go-new）
        // 和给人看的名字（opencode go）两套，显示用后者。
        var s = d.current
        if (s && s.provider && d.groups) {
          for (var i = 0; i < d.groups.length; i++) {
            if (d.groups[i].id === s.provider) { s.provider = d.groups[i].name; break }
          }
        }
        show(s)
      })
      .catch(function () { /* 读不到就保持原样，不显示错的东西 */ })
  }

  load()
  // 在电脑上改了模型，手机这边也要跟上。**轮询很土，但这里是诚实的做法**：
  // 我们没法从这段独立代码挂进页面已有的那条 SSE，而显示一个过期的模型名
  // 比不显示更糟——用户会以为自己改的没生效。15 秒一次，开销可以忽略。
  setInterval(function () { if (!document.hidden) load() }, 15000)
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load() })
})()
</template>

<main id="main">
  <div id="reply"></div>
  <!-- 「正在执行」是常驻元素，不参与 #reply 的整块重绘。
       拼进重绘里的话，每次状态广播都会把它重建一次，轮播和浮动动画会一直从头开始。 -->
  <div id="work" class="work" hidden>
    <div class="work-top">
      <div class="work-stage" id="workStage"></div>
      <div class="work-bubble" id="workBubble">正在执行…</div>
    </div>
    <div class="work-progress"><i></i></div>
    <div class="work-foot">
      <span class="work-elapsed" id="workElapsed"></span>
      <button class="stop" id="btnStop" type="button">停止</button>
    </div>
  </div>

  <!-- 排队中的指令。**它必须留在 #work 外面。**
       原来它挂在 #work 里面，而 #work 在回答开始流式生成时会整块隐藏
       （用户 2026-09-22 提的「内容开始流式生成的时候，鲸鱼娘的动画就可以消失了」），
       于是排队列表被一起藏掉了。用户 2026-09-22 报：「排队列表现在手机端直接没出现了」。
       这个 bug 是**被流式修好之后才变明显的**：门槛从 120 降到 40 之后，回答很早就开始
       流式、state.live 长期有值，用户接着发指令时正好落在那个窗口里。
       排队和鲸鱼娘是两件事——前者是「还有几条在等」，后者是「她正在忙」，
       别因为后者要藏就把前者一起藏了。 -->
  <div class="queue" id="queue" hidden></div>

<div class="attach-bar" id="attachBar" hidden></div>
<footer>
  <!-- 回形针。input 藏起来，按钮点它——iOS 上直接放一个 file input 样式很难统一。 -->
  <button class="attach" id="btnAttach" type="button" aria-label="上传文件" title="上传文件">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
  </button>

  <textarea id="input" rows="1" placeholder="说点什么…" enterkeyhint="send"></textarea>
  <button class="send" id="btnSend">发送</button>
</footer>

<div id="nav">
  <aside class="nav-panel">
    <div class="nav-head">
      <span>工作区与会话</span>
      <button class="icon-btn" id="btnNavRefresh" aria-label="刷新">⟳</button>
      <button class="icon-btn" id="btnNavClose" aria-label="关闭">✕</button>
    </div>
    <div class="nav-body" id="navBody"></div>
  </aside>
</div>

<div id="settings">
  <div class="sheet">
    <h2>设置</h2>

    <div class="row">
      <div>
        <div class="label">显示模式</div>
        <div class="hint">单帧：只留最新一条回复</div>
      </div>
      <div class="seg" id="segMode">
        <button data-mode="minimal">单帧</button>
        <button data-mode="chat">聊天</button>
      </div>
    </div>

    <!-- 权限档位。整块由脚本填：这台电脑有哪些档位是**运行时读**的，一个都不写死。
         服务拿不到时整块不显示——它是附加能力，缺了遥控本身照常。 -->
    <div id="permBlock" hidden>
      <div class="row">
        <div>
          <div class="label">权限档位</div>
          <div class="hint" id="permHint">作用在当前会话上</div>
        </div>
      </div>
      <div class="seg" id="segPerm"></div>
    </div>

    <!--
      这里原来有两行：「完成后提醒」和「语音输入」。

      2026-09-21 用户裁决：**两行都从设置里撤掉，不让用户看到**——
      它们都是浏览器安全上下文的限制（明文 http 下 Notification 和麦克风都用不了），
      写在设置里只是把浏览器的一条规矩转嫁给用户去理解。相关知识记在下面
      「浏览器系统通知」那段注释和 tasks/lessons.md 里，不占用户界面。

      想用语音输入：手机键盘自带的 🎤 听写键，任何连接下都能用。
      想人不在也能收到提醒：电脑端的外部推送（Bark / ntfy / Telegram），
      从服务器发出去，不受浏览器这条规矩限制。
    -->

    <div class="row">
      <div>
        <div class="label">提示音与震动</div>
        <div class="hint">回复到达时提醒（需先点一次页面）</div>
      </div>
      <div class="seg" id="segSound">
        <button data-sound="on">开</button>
        <button data-sound="off">关</button>
      </div>
    </div>

    <!--
      「页面在后台时提醒」。**现在不露出来了，藏到底。**

      2026-09-21 它整行被撤掉过，理由是当时三条连接路径全是明文 http，浏览器不给发
      系统通知，摆出来只是让用户点一下碰一鼻子灰。

      2026-09-25 白天 Tailscale 那条路接通 HTTPS，它回来过一次；**当晚又撤了**。
      第二次撤的理由和第一次不同，也更硬：**手机锁屏会冻结后台页面**，那条实时连接
      跟着断掉，回复根本到不了页面，也就没人去发通知。这不是"前提没到"，是浏览器这条
      路本来就有上限——service worker 也救不了，它是被事件唤醒的，没有事件它就不存在。

      用户原话：「类似功能我们以后考虑做成 APP 时再加，浏览器里不放了。」

      **代码全部留着，只是不露出来**（见下面 serviceWorker.register 那段的注释）。
      将来做 App 里的锁屏提醒，这些知识直接能用。真正不怕锁屏的是电脑端那条外部推送
      （Bark/ntfy/Telegram，lib/notify.js），从服务器直接发出去，不经过浏览器。

      为什么非要有 service worker：手机浏览器上 new Notification() 会直接抛 TypeError，
      唯一能发系统通知的入口是 ServiceWorkerRegistration.showNotification()。
      详见 lib/sw.js。
    -->
    <div class="row" id="rowNotify" style="display:none">
      <div>
        <div class="label">页面在后台时提醒</div>
        <div class="hint" id="notifyHint">回复到了发一条系统通知</div>
      </div>
      <div class="seg" id="segNotify">
        <button data-notify="on">开</button>
        <button data-notify="off">关</button>
      </div>
    </div>

    <div class="row">
      <div>
        <div class="label">连接</div>
        <div class="hint" id="connHint">—</div>
      </div>
      <button class="btn" id="btnReconnect">重连</button>
    </div>

    <div class="foot">
      <button class="btn" id="btnForget">清除 token</button>
      <button class="btn primary" id="btnClose">完成</button>
    </div>
  </div>
</div>

<div id="gate">
  <h1>需要访问令牌</h1>
  <p>在电脑上打开 DSH 的「设置 → 手机遥控」，用手机重新扫一次二维码就能进来。
     或者把那一页上的链接整条复制到浏览器地址栏打开。</p>
  <input id="gateInput" type="text" placeholder="粘贴 token" autocomplete="off"
         autocapitalize="off" autocorrect="off" spellcheck="false">
  <div class="err" id="gateErr"></div>
  <button id="gateBtn">进入</button>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  var DEFAULT_MODE = '__DEFAULT_MODE__';
  var NEEDS_TOKEN = __NEEDS_TOKEN__;
  // 构建指纹，由服务端注入。拼在立绘地址后面，换了图浏览器就不会一直用缓存那张。
  var BUILD = '__BUILD__';
  // 单个文件的大小上限（字节），由服务端注入。页面里不写第二份——两处各写一个数，
  // 迟早会不一致，而那时候的表现是「页面让你传，服务端拒绝」。
  var MAX_UPLOAD = __MAX_UPLOAD__;

  // ---------------- 状态 ----------------
  var params = new URLSearchParams(location.search);
  var state = {
    token: params.get('token') || localStorage.getItem('dshMiniToken') || '',
    mode: localStorage.getItem('dshMiniMode') || DEFAULT_MODE || 'minimal',
    sound: localStorage.getItem('dshMiniSound') !== 'off',
    // 锁屏也能提醒（系统通知）。默认关着——它要用户主动点一下才会申请权限，
    // 不能替他决定。明文连接下这一项永远是空转的，见下面「锁屏也能提醒」那一段。
    notify: localStorage.getItem('dshMiniNotify') === 'on',
    running: false,
    sessions: [],
    // 排队中的指令（[{ id, text, placement }]）。跑着任务时接着发的那几条排在这儿，
    // 由服务端每次取快照时从 agent 的收件箱现读，手机不自己记。
    queued: [],
    boundSessionId: null,
    connected: false,

        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { body.push(cells(lines[i])); i += 1; }

          + '</tr></thead><tbody>'
          + body.map(function (r) {

          }).join('')

        continue;
      }

      // 段落：连续的非空、非块起始行合成一段
      var para = [line];
      i += 1;
      while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) { para.push(lines[i]); i += 1; }
      html.push('<p>' + para.map(mdInline).join('<br>') + '</p>');
