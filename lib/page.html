<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>极简遥控器</title>
<style>
  /* ---------- 设计令牌 ----------
     规格来自用户 2026-09-27 定的六关键词翻译表，改之前先读这一段：
       · 圆角只有两档：卡片一律 2px，状态点用 999px/50%。**没有中间档**。
       · 阴影只有两档，且都极浅；层次主要靠 --line 这条 1px 细线和间距建立。
       · 强调色分两个角色，加起来**一屏最多两处**：
         --gold 是**当字/点**用的（刻度上"当前这一步"）；--act 是**当底**用的（主按钮）。
         深色下两个都是暖金 #c9a55c；浅色下 --gold 压深成 #8a6529（白底才读得清），
         --act 换成宣传图的宝蓝 #3b6fc4——用户 2026-09-27 看过对照图后定的：浅色那套
         底色本来就是从宣传图取的，冷底上再压一块饱和暖金，比在深色下更像外来物。
         需要"显眼一点"的地方一律用鲸鱼娘的冰蓝 --ice，别动这两个。
       · --ok/--run/--err 是状态点的语义色，占的是 8px 一个小点，不算强调色。
       · 配色以鲸鱼娘为准心：深海墨蓝打底，她的冰蓝作次级色。
       · 两套主题：这套（默认，深色）和 [data-theme="light"]，色调跟宣传图
         （docs/promo.png）统一。**颜色令牌两边必须一一对应**——缺一个，就有元素
         在某个主题下"隐身"，而且只在那个主题下才看得出来。守卫在 test/ui.test.mjs。 */
  :root {
    color-scheme: dark;
    --bg: #0a0f16;
    --bg-top: #101a27;
    --bg-deep: #070b11;
    --panel: #121a25;
    --panel-2: #18222f;
    --line: #22303f;
    --fg: #e3ebf4;
    --muted: #7b8a9b;
    --dim: #6c7a8b;
    --ice: #a9c8e8;
    --gold: #c9a55c;      /* 强调色当**字/点**用：刻度上"当前这一步" */
    --act: #c9a55c;       /* 强调色当**底**用：一屏一个的主按钮 */
    --ok: #4fb477;
    --run: #a9c8e8;
    --err: #d4614f;
    --r: 2px;
    --sh-1: 0 1px 2px rgba(0, 0, 0, .28);
    --sh-2: 0 2px 6px rgba(0, 0, 0, .34);
    --glass: rgba(18, 26, 37, .72);
    --tint: rgba(24, 34, 47, .5);    /* 队列那块比面板再深一点的底 */
    --pop: rgba(24, 34, 47, .97);    /* 浮起来的小面板（指令菜单等） */
    --scrim: rgba(0, 0, 0, .55);     /* 弹出层背后压暗的那层；浅色主题里它得轻得多 */
    --on-act: #10161f;    /* 实心主按钮上的字：金底配白字读不清 */
  }
  /* 浅色主题：色调跟宣传图（docs/promo.png）统一——近白的冰蓝底、深宝蓝的字与状态色、
     白色卡片、极浅的蓝投影。深色那边的规矩一条不改：圆角两档、层次靠 1px 细线。
     强调色在浅色下分了家：当字/点用的金压深到 #8a6529，当底用的主按钮换成宣传图的宝蓝
     （#3b6fc4 配白字）——用户 2026-09-27 看过对照图后定的。
     切换入口在设置页「外观」；选择存在 localStorage，首屏之前就定好，不会闪一下。 */
  [data-theme="light"] {
    color-scheme: light;
    --bg: #eaf3fc;
    --bg-top: #f7fbff;
    --bg-deep: #dbe9f8;
    --panel: #ffffff;
    --panel-2: #f2f8ff;
    --line: #d3e2f3;
    --fg: #1b2c49;
    --muted: #6b7f9b;
    --dim: #8496ae;
    --ice: #3b6fc4;
    --gold: #8a6529;      /* 白底上当字用，得压深才读得清 */
    --act: #3b6fc4;       /* 主按钮底：用宣传图那个宝蓝（用户 2026-09-27 裁决） */
    --ok: #2e9a5f;
    --run: #3b6fc4;
    --err: #c0392b;
    --sh-1: 0 1px 2px rgba(28, 60, 110, .07);
    --sh-2: 0 2px 8px rgba(28, 60, 110, .12);
    --glass: rgba(255, 255, 255, .74);
    --tint: rgba(59, 111, 196, .07);
    --pop: rgba(255, 255, 255, .98);
    --scrim: rgba(23, 52, 95, .30);
    --on-act: #ffffff;    /* 宝蓝底上的字 */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    /* 纵深：顶部略亮、底部更深，做出"空间"而不是一整块平色。
       设计稿参考的是沉浸式暗色流媒体那一套——界面浮在深色基底上，不是被切成几块。 */
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 55%, var(--bg-deep) 100%);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  /* ---------- 顶栏 ---------- */
  /* 顶栏和底栏是两块**悬浮毛玻璃**：内容从它们底下淡出，界面像浮着，
     而不是上下两条实心色带把屏幕切成三块。 */
  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
    background: var(--glass); border-bottom: 1px solid var(--line);
    -webkit-backdrop-filter: blur(14px) saturate(1.1);
    backdrop-filter: blur(14px) saturate(1.1);
  }
  .brand { font-weight: 600; letter-spacing: .3px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex: 0 0 auto;
    /* 状态变化是**瞬时**的：数据在变，界面不表演。
       这里原来挂着一圈 1.2s 的呼吸闪动，2026-09-27 按规格删掉了——
       "正在思考"的脉动圆点是那几年的视觉套话；而"它在动"这件事，下面那块正在执行区
       里她说的那句话和秒数已经说得更准，也更安静。160ms 是本页唯一保留的过渡节奏。 */
    transition: background .16s;
  }
  .dot.ok { background: var(--ok); }
  .dot.run { background: var(--run); }
  .dot.err { background: var(--err); }
  .status { color: var(--muted); font-size: 13px; flex: 1 1 auto;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn {
    flex: 0 0 auto; width: 36px; height: 36px; border-radius: var(--r);
    border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
    font-size: 16px; display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { transform: scale(.94); }

  /* ---------- 子智能体（2026-10-03） ----------
     整块**只新增两条外观**：列表里的一行、聊天记录里那张完工卡片。其余全部复用：
     抽屉外壳用设置那一套（#subagents 的骨架和 .sheet 完全一样），状态点用既有 .dot，
     主按钮用既有 .btn.primary，气泡用既有 .bubble / .said。

     **一个颜色令牌都没新加**：全用主屏已有的那几个，浅色主题下跟着变就行——
     令牌是两套主题各写一份的，新造一个就等于在浅色下多挖一个坑。

     也没有新的关键帧：卡片能不能展开交给原生 <details>，不写一行脚本去演它。 */
  #subagents {
    position: fixed; inset: 0; background: var(--scrim);
    display: none; align-items: flex-end; z-index: 50;
  }
  #subagents.open { display: flex; }
  .sa-head { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
  .sa-head h2 { margin: 0; font-size: 16px; flex: 1 1 auto; }
  .sa-back {
    flex: 0 0 auto; border: none; background: transparent; color: var(--muted);
    font: inherit; font-size: 14px; cursor: pointer; padding: 0;
  }
  .sa-none { color: var(--muted); font-size: 14px; padding: 6px 0 2px; }
  /* 行负着左右两边的 16px：让分隔线横贯整个抽屉，而不是在里面缩一截。 */
  .sa-list { margin: 0 -16px; }
  .sa-row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 12px 16px; border: none; border-bottom: 1px solid var(--line);
    background: transparent; color: var(--fg); font: inherit; text-align: left; cursor: pointer;
  }
  .sa-row:last-child { border-bottom: none; }
  /* 清单还在读时那一行也在 .sa-list 里，会被那 -16px 拽到贴屏边，
     和行的文字差着一档。补回 .sa-row 同一个 16px 才对齐。 */
  .sa-none.sa-none-indent { padding-left: 16px; }
  /* 读不动的那一支只有说明、点不动，所以没有手指光标。 */
  .sa-plain { cursor: default; }
  .sa-main { flex: 1 1 auto; min-width: 0; }
  .sa-name { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sa-sub { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
  /* 数字用等宽数位：几行并排时小数点对齐，扫一眼就能比大小。 */
  .sa-num {
    flex: 0 0 auto; text-align: right; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums; line-height: 1.5;
  }
  .sa-acts { display: flex; gap: 10px; margin-top: 16px; }
  .sa-acts .btn { flex: 1 1 0; text-align: center; }
  .sa-ask { display: flex; gap: 10px; margin-top: 16px; align-items: flex-end; }
  .sa-ask input {
    flex: 1 1 auto; min-width: 0; padding: 10px 12px; border-radius: var(--r);
    border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
    font: inherit; font-size: 16px; line-height: 1.5; outline: none;
  }
  .sa-ask input:focus { border-color: var(--ice); }
  .sa-ask .btn { flex: 0 0 auto; }
  .sa-doc { max-height: 52vh; overflow-y: auto; margin: 0 -16px; padding: 0 16px; }
  .sa-doc .bubble, .sa-doc .said { max-width: 100%; }

  /* 完工卡片。展开/收起用原生 <details>：不写脚本、不加关键帧，键盘和读屏也都认。
     样子和主会话里那张卡片同一个思路——单薄一层边框，不抢回答的气泡感。 */
  .sa-card {
    margin: 10px 0; border: 1px solid var(--line); border-radius: var(--r);
    background: var(--panel-2); overflow: hidden;
  }
  .sa-card > summary {
    display: flex; align-items: center; gap: 8px; list-style: none;
    padding: 10px 12px; font-size: 13px; color: var(--muted); cursor: pointer;
  }
  .sa-card > summary::-webkit-details-marker { display: none; }
  .sa-card > summary b { color: var(--fg); font-weight: 600; }
  .sa-card[open] > summary { border-bottom: 1px solid var(--line); }
  .sa-card .sa-body {
    padding: 10px 12px; font-size: 14px; white-space: pre-wrap;
    word-break: break-word; max-height: 240px; overflow: auto;
  }

  /* ---------- 显示区 ---------- */
  main { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 14px; }
  main.center { display: grid; place-items: center; }

  #reply {
    white-space: pre-wrap; word-break: break-word;
    font-size: 16px; line-height: 1.75;
  }
  #reply a { color: var(--ice); }
  .placeholder { color: var(--muted); font-size: 15px; text-align: center; line-height: 1.9; }
  .placeholder kbd {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--r); padding: 1px 6px; font-size: 13px; font-family: inherit;
  }

  /* ---------- 聊天模式 ---------- */
  /* width: fit-content 是关键，别删。
     气泡是个块级元素，而块级元素的宽度默认是「撑满容器」——只写 max-width 的话，
     那只是给它封了个顶，短消息（「好的」「继续」）照样会撑成一个 86% 宽的大方块，
     右边留一大片空白。fit-content 让它按内容收：短的自适应，长的到 86% 就折行。
     两种气泡都要，只改一边的话，短回复那边还是会露出大方块，看着像坏了。 */
  .bubble {
    width: fit-content;
    max-width: 86%; padding: 10px 13px; border-radius: var(--r);
    /* 18px，和 .said 的下边距一致。原来是 10px，用户 2026-09-22 实机提「指令气泡和
       回答正文第一行之间贴得太紧」——10px 是「同一条消息内部」的距离，
       而这里跨的是「我说的话」和「它答的话」，是更大的一个断点，该给更多。 */
    margin-bottom: 18px; white-space: pre-wrap; word-break: break-word;
    font-size: 15.5px; line-height: 1.7;
  }
  .bubble.user { margin-left: auto; background: var(--panel-2); border: 1px solid var(--line); }
  .bubble.assistant { margin-right: auto; background: var(--panel); border: 1px solid var(--line); }
  .bubble a { color: var(--ice); }
  .bubble .meta { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); }
  /* 「已停止」标签：被按停的那一轮，手机上收到的只是**已经吐出来的那半句**。
     不标出来的话，它看着就像模型答崩了。 */
  .stopped {
    display: inline-block; padding: 1px 7px; border-radius: var(--r); font-size: 11px;
    color: var(--muted); border: 1px solid var(--line); vertical-align: middle;
  }
  .reply-bar .stopped { margin-right: auto; }
  /* ---------- Markdown 正文 ---------- */
  /* 外层是 pre-wrap（用户消息和旧内容靠它），markdown 输出的是真块级元素，
     所以要在这里把 pre-wrap 收掉，否则段落之间会多出一堆空行。 */
  .md { white-space: normal; }
  /* 回复里的图。地址有两种写法，见下面 mdInline() 里那段注释。
     宽度只封顶不写死：窄屏上占满可用宽度、按比例缩，圆角沿用全站那 2 像素。 */
  /* 图片没加载出来时的那一圈虚线。用中性灰，不动暖金——那是唯一的强调色，一屏最多两次。 */
  .md-img-bad {
    outline: 1px dashed rgba(0, 0, 0, .35);
    outline-offset: 2px;
  }

  .md-img {
    display: block; max-width: 100%; height: auto; margin: 10px 0;
    border-radius: var(--r); border: 1px solid var(--line); background: var(--panel-2);
  }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 .7em; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
    margin: 1em 0 .5em; line-height: 1.35; font-weight: 650;
  }
  .md h1 { font-size: 1.35em; }
  .md h2 { font-size: 1.22em; }
  .md h3 { font-size: 1.1em; }
  .md h4, .md h5, .md h6 { font-size: 1em; }
  .md ul, .md ol { margin: 0 0 .7em; padding-left: 1.4em; }
  .md li { margin: .18em 0; }
  .md a { color: var(--ice); word-break: break-all; }
  .md strong { font-weight: 650; }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 1em 0; }
  .md blockquote {
    margin: 0 0 .7em; padding: .1em 0 .1em .8em;
    border-left: 3px solid var(--line); color: var(--muted);
  }
  .md code {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r);
    padding: .1em .35em; font-size: .88em;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .md .code {
    margin: 0 0 .7em; border: 1px solid var(--line); border-radius: var(--r);
    background: var(--panel-2); overflow: hidden;
  }
  .md .code-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 5px 8px 5px 10px; border-bottom: 1px solid var(--line);
  }
  .md .code-head .lang { font-size: 11px; color: var(--muted); }
  .md .code pre { margin: 0; padding: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .md .code code {
    background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.6;
    white-space: pre;
  }
  /* 表格窄屏放不下就横向滚，别把页面撑破 */
  .md table { border-collapse: collapse; margin: 0 0 .7em; font-size: .92em; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; white-space: nowrap; }
  .md th { background: var(--panel-2); font-weight: 600; }

  /* 复制按钮：方形的图标按钮，图标是两个重叠的方框（就是常见那个复制图标）。
     点下去换成对勾，1.4 秒后自己变回来——手机上没法悬停，也没有「已复制」的
     系统提示，这个反馈是唯一的，所以必须有。
     三个地方共用：单帧模式的整篇、聊天模式的气泡、代码块。 */
  .copy {
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; padding: 0; border-radius: var(--r); cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
  }
  .copy svg {
    width: 15px; height: 15px; fill: none; stroke: currentColor;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }
  .copy:active { transform: scale(.95); }
  .copy.done { color: var(--ice); border-color: var(--ice); }
  .bubble .meta .copy { margin-left: 8px; vertical-align: middle; }
  /* 上面那条只放「已停止」标签——它是给正文打的预防针，得在正文之前出现。
     复制按钮挪到正文下面去了（.reply-foot）。 */
  .reply-bar { display: flex; justify-content: flex-start; margin-bottom: 8px; }
  /* 复制按钮在正文下方、靠左——用户要求。原来在上面靠右，拇指够不着，
     而且会比正文先入眼。 */
  .reply-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .reply-foot .time { font-size: 11.5px; color: var(--muted); }
  /* 聊天模式下 AI 的回答**不套气泡**（用户要求「参考单帧模式那样」）。
     用户自己的指令仍然是气泡，一左一右、一个有框一个没框，正好分得清谁说的。 */
  .said { margin-bottom: 18px; }
  /* ---------- 历史里的一条指令（会话做的一个动作，不是谁说的话） ----------
     和上面两种气泡都刻意画得不同：不套框、不给复制按钮，只用左边一条细线起头。
     它是**系统动作**——长得像一句话，就会被当成 AI 的回答去读，而它根本不是回答。 */
  .cmd {
    display: flex; align-items: baseline; gap: 8px;
    width: fit-content; max-width: 100%;
    margin: 0 0 14px; padding: 4px 10px 4px 9px;
    border-left: 2px solid var(--line); border-radius: 0 var(--r) var(--r) 0;
    background: var(--panel-2); font-size: 13px; line-height: 1.5;
  }
  /* 名字加参数排一行，太长就省略——它是「做了哪件事」的标签，不是正文。
     收缩权重给到 10：位置要让给下面那条结果。挪不开的时候它先让到 0
     （2026-09-30 之前就是这样：长结果把标签挤没了），这个观感这次不动它。 */
  .cmd .cmd-line {
    flex: 0 10 auto;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--fg);
  }
  /* 结果是**正文**，得能整段读全。原来是 `flex: 0 0 auto`——那等于「这一格不许缩，
     一行放完」，于是长结果（2026-09-30 用户报的 /doctor 那条）直接顶出 .cmd 的框，
     顶出去的半截连底色都没有；.cmd 不裁剪，溢出再顶到 main，而 main 的 overflow-y:auto
     会把横向一起算成滚动区，整页于是能左右拉、右边那截得滑一下才看得见。
     改成可以缩（min-width:0 拿掉「不许窄于内容」的下限）+ 允许从任意处断开，
     长结果就在框里正常折行。不做横向滚动、也不做省略号截断：用户要的是读全。 */
  .cmd .cmd-res {
    flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere;
    color: var(--muted);
  }
  .cmd.success { border-left-color: var(--ok); }
  .cmd.success .cmd-res { color: var(--ok); }
  /* 出错的那一种必须是红的：整串历史里只有它需要用户抬眼看一下。 */
  .cmd.error { border-left-color: var(--err); }
  .cmd.error .cmd-res { color: var(--err); }
  /* ---------- 正在流出来的那一段 ---------- */
  /* 和最终答案**刻意画得不一样**：上面一条虚线、末尾一个闪动的竖条、没有复制按钮。
     三样都在说同一句话——「这不是最终答案，还会变」。等答案落定整块被换掉。 */
  .live {
    margin-top: 18px; padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  .live .md > *:last-child::after {
    content: ''; display: inline-block; width: 2px; height: 1em;
    margin-left: 2px; vertical-align: -2px;
    background: var(--ice);
    animation: caret 1s steps(2, start) infinite;
  }
  @keyframes caret { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  /* ---------- 「正在执行」：鲸鱼娘 + 进度条 + 气泡 ----------
     单帧模式下它出现在上一条回答的**下方**，不顶掉它，所以要用虚线跟正文分开，
     不然会被当成那条回答的一部分。 */
  .work {
    margin-top: 20px; padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  /* 立绘和气泡是**一组**。这里把两件事拆开：
       立绘站哪儿 → 由**这一行的宽度**决定，跟词条无关；
       气泡多宽   → 由词条自己的长短决定。
     行宽取「最长那句」的整组宽度，再把这一行居中，于是立绘永远站在同一个位置。
     算账：立绘 122 + 间隙 6 + 最长那句的气泡 171 = 299。
     那个 171 = 10 个全角字 × 14.5px，加左右内边距 24、边框 2。
     用 max-content 而不是写死 width：将来真加了更长的词条，这行会自己撑开——
     宁可立绘挪一点，也不能让字顶出屏幕。
     min() 是窄屏退路：屏幕比 299 还窄时，这行跟着屏幕收，别溢出。
     **max-width 那一行是把上面那句话真正落实**（2026-09-27 补）：光有
     `max-content` + `min-width` 只有下限没有上限，而气泡的 `max-width:
     calc(100% - 128px)` 里的那个 100% 又是拿这一行自己算的——两头都靠对方，
     谁也没被真正管住。结果是一句长话（尤其我那几句英文思考）把整行撑到屏幕外，
     手机上得横着划才能看见（用户截图报的就是这个）。钉死在这一行的宽度上才算数。 */
  .work-top {
    display: flex; align-items: flex-start; gap: 6px;
    width: max-content; min-width: min(299px, 100%); max-width: 100%;
    margin: 0 auto;
  }

  /* 立绘：每个姿势是一张「并排若干帧」的雪碧图（每帧 380×330），靠 background-position
     在帧与帧之间硬切，手脚就真的在动——不是把一张静图晃一晃。
     七层叠在一起，换姿势时交叉淡入。
     帧数写在数据里（POSES[i].frames，缺省 2）；下面默认那套就是 2 帧的写法。 */
  .work-stage {
    position: relative; flex: 0 0 auto;
    width: 122px; height: 106px;
    /* 这里原来还叠着一层 2.4s 的上下浮动（`workBob`），2026-09-27 删掉：
       她的翻帧本身就是"活着"的证据，再叠一层漂浮就变成界面在表演了。 */
  }
  .pose {
    position: absolute; inset: 0;
    background-repeat: no-repeat;
    background-position: 0 0;
    background-size: 244px 106px;   /* 两帧并排的显示宽度 = 122 × 2 */
    opacity: 0; transition: opacity .35s ease;
    animation-name: poseFlip;
    animation-timing-function: step-end;
    animation-iteration-count: infinite;
    animation-play-state: paused;   /* 没轮到它的层就别动，省电 */
  }
  .pose.on { opacity: 1; animation-play-state: running; }
  /* 前半段左帧、后半段右帧。49.9%→50% 那一下是硬切、不插值，
     不然会看到两张图横向滑过去。 */
  @keyframes poseFlip {
    0%, 49.9% { background-position: 0 0; }
    50%, 100% { background-position: -122px 0; }
  }
  /* 6 帧的姿势（冲刺的头发是程序化生成的 6 帧，见 tools/whale-sway.py）：
     显示宽度 122×6，关键帧每 1/6 走一格。
     step-end 会把每一格的值保持到下一格，所以每格只写一个百分比就够。
     **总时长不动**（还是 POSES[i].flip 秒）：这样腿脚换帧的快慢和 2 帧时一模一样，
     多出来的帧只是把头发那一趟摆动切得更细。 */
  .pose[data-frames="6"] {
    background-size: 732px 106px;
    animation-name: poseFlip6;
  }
  @keyframes poseFlip6 {
    0%      { background-position: 0 0; }
    16.667% { background-position: -122px 0; }
    33.333% { background-position: -244px 0; }
    50%     { background-position: -366px 0; }
    66.667% { background-position: -488px 0; }
    83.333% { background-position: -610px 0; }
  }

  /* 气泡：左边一个小尖角指向立绘。
     宽度**贴着自己的词条**，多长就多宽，右边不留空。
     它推不动立绘——立绘的位置由上面 .work-top 的固定行宽管着，跟气泡宽窄无关。
     所以「词条每 3.6 秒换一次」这件事不会让立绘左右晃。
     max-width 是窄屏退路：立绘 122 + 间隙 6，剩下的都给气泡，宁可折行也别顶出屏幕。

     **竖着不限行数**（2026-09-27 用户报的：一句长话被切掉半行）。原来是
     `-webkit-line-clamp: 3` + `overflow: hidden`——第四行连省略号都没有地截断，
     看着像她话说了一半。现在让气泡自己长高，整页跟着让位（main 本来就能上下滚）。
     留一道 `max-height` + 内部滚动只为兜病态长文（几屏）：正常一两句话够不到它。
     `align-self: flex-start` 让气泡顶到行首、和她的头对齐。 */
  .work-bubble {
    position: relative; flex: 0 1 auto;
    max-width: calc(100% - 128px);
    align-self: flex-start; margin-top: 6px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--r); padding: 9px 12px;
    font-size: 14.5px; line-height: 1.5; color: var(--fg);
    max-height: 50vh; overflow-y: auto;
    /* 长英文串、URL 不认换行，会把气泡顶宽。中文本来就能任意断行，这条是给它们兜的。 */
    overflow-wrap: anywhere;
  }
  /* hidden 只是 UA 样式表里的一条 display:none，元素自己没写 display 时它才管用——
     原来这里有个 `display: -webkit-box` 把它盖掉了，于是「词条是空串就把气泡收起来」
     根本没生效，跑动那张旁边一直挂着一个没字的空药丸（2026-09-27 用户截图报的）。 */
  .work-bubble[hidden] { display: none; }
  /* 尖角固定在气泡**上部**（对准她的头），不跟着气泡高度跑。原来钉在 50%，气泡一长高，
     尖角就滑到她身子下边去了——长句和短句都得指着头，所以要一个绝对值。 */
  .work-bubble::before, .work-bubble::after {
    content: ''; position: absolute; top: 24px; width: 0; height: 0;
    border: 6px solid transparent; margin-top: -6px;
  }
  .work-bubble::before { left: -12px; border-right-color: var(--line); }
  .work-bubble::after { left: -11px; border-right-color: var(--panel-2); }
  /* 气泡里的话走和回答区同一套行内渲染（`mdInline`）：`**加粗**`、`` `代码` ``、链接会变成样式。
     代码的底色特意不用 --panel-2——那是气泡自己的底色，套上去等于看不见。 */
  .work-bubble strong { font-weight: 650; }
  .work-bubble a { color: var(--ice); word-break: break-all; }
  .work-bubble code {
    background: rgba(127, 127, 127, .18); border: 1px solid var(--line); border-radius: var(--r);
    padding: .1em .35em; font-size: .88em;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  /* 进度条是**不确定进度**，不是百分比。
     插件按设计只收「指令 + 最终回复」，拿不到 Agent 此刻跑到哪一步，
     所以画一个填到 80% 的假进度条等于撒谎。它只表达「在跑」，不表达「跑到哪了」。

     这一段前后改过三次，方向来回，写清楚免得再兜圈子：
       ① 最初是一条来回扫的流光（`workSweep`），按 UI 规格删掉——流光属于"看起来在动"
          的廉价套话；
       ② 删完剩一根**定在 38% 的静态标记**。结果更糟：用户实机一看就问「底部的进度条
          好像不会动」，而一根停在三成八的线，比一个会动的它**更**像在谎报百分比；
       ③ 现在：宽度写死 38% 永不改变，动的是**位置**——十六格一轮、每格 160ms，
          也就是全页那一个节奏。推进式（steps）而不是匀速流淌。
     它仍然不知道跑了多少；它只是不再假装停住。 */
  .work-progress {
    margin-top: 10px; height: 1px;
    background: var(--line); overflow: hidden;
  }
  .work-progress i {
    display: block; width: 38%; height: 100%;
    background: var(--ice);
    animation: barStep 2.56s steps(16, end) infinite;
  }
  /* 从左外侧进来、从右外侧出去。38% 宽的块想走完一整条轨道，位移得是自身宽度的
     263%（100 ÷ 38 ≈ 2.63）。用 steps 而不是匀速：一格一格地推进，
     跟上面那把刻度尺是同一种秩序感。 */
  @keyframes barStep {
    from { transform: translateX(-100%); }
    to   { transform: translateX(263%); }
  }
  /* 秒数在左、停止按钮在右。秒数原来是自己一行右对齐，现在跟按钮同一行。 */
  .work-foot {
    margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .work-elapsed {
    color: var(--muted); font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  /* 停止按钮。做成描边而不是实心：它是个「打断」，不该比「发送」还显眼。
     按下去之后自己禁用并改文案——cancel() 只是递请求，真正停下要等状态翻，
     这中间必须让用户看见「已经按到了」，否则会连按好几下。 */
  .stop {
    padding: 5px 14px; border-radius: var(--r); font-size: 13px;
    border: 1px solid var(--line); background: transparent; color: var(--fg);
    transition: opacity .15s;
  }
  .stop:disabled { opacity: .5; }

  /* 排队中的指令。跑着任务时接着发的那几条排在这儿，等这一轮跑完再跑。
     单帧模式下你发出去的那句话在别处一个字都看不见（那一模式只显示回复），
     所以这块是唯一的反馈，不能省。 */
  /* ---------- 工序刻度尺 ----------
     **它代表的是"队列"，不是 Agent 的工序。** 插件按设计只收「指令 + 最终回复」，
     根本看不到 Agent 此刻跑到哪一步（见上面进度条那一段）。所以刻度上每个点都对应
     一条真实存在的指令：第一个点是**正在跑的那条**（暖金），后面是排着队的（空心）。
     设计稿里画的是一条理想中的工序进度尺；落到真实实现，只有队列是插件真知道的事，
     就按队列画——界面上不出现编出来的数据。 */
  .queue {
    margin-top: 12px; padding: 12px;
    border: 1px solid var(--line); border-radius: var(--r);
    background: var(--tint);
  }
  .queue .q-head { font-size: 11.5px; color: var(--muted); margin-bottom: 10px; }
  .queue .q-scale {
    position: relative; display: flex; align-items: center; height: 24px; margin: 2px 0 10px;
  }
  /* 刻度之间的那条细线：垫在点底下，两端各留 3px，不顶到边。 */
  .queue .q-scale::before {
    content: ''; position: absolute; left: 3px; right: 3px; top: 6px;
    height: 1px; background: var(--line);
  }
  .queue .q-node {
    position: relative; flex: 1 1 0; display: flex; flex-direction: column;
    align-items: center; gap: 5px;
  }
  .queue .q-node i {
    display: block; width: 7px; height: 7px; border-radius: 50%;
    box-sizing: content-box; border: 1px solid var(--line); background: var(--bg);
    /* 全页唯一允许的动效：节点由"待"变"过"时 160ms 颜色过渡。 */
    transition: background .16s ease, border-color .16s ease;
  }
  /* 刻度上"当前这一步"是**当字用**的那个强调色（--gold）：浅色主题底下它要压深，
     所以这里是 --gold 而不是 --act——--act 是"当底用"的，浅色下已经换成宝蓝了。 */
  .queue .q-node.cur i { background: var(--gold); border-color: var(--gold); }
  .queue .q-node b {
    font-weight: 400; font-size: 10.5px; line-height: 1;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .queue .q-node.cur b { color: var(--gold); }
  .queue .q-row {
    display: flex; align-items: center; gap: 8px; padding: 3px 0;
    font-size: 13.5px; line-height: 1.45;
  }
  /* 长指令折行，但最多两行——队列是「提醒还有几条」，不是给人重读全文的地方。 */
  .queue .q-text {
    flex: 1 1 auto; min-width: 0; color: var(--fg);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .queue .q-drop {
    flex: 0 0 auto; width: 24px; height: 24px; padding: 0; line-height: 1;
    border-radius: var(--r); font-size: 12px;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
  }
  .queue .q-drop svg {
    width: 12px; height: 12px; fill: none; stroke: currentColor;
    stroke-width: 1.6; stroke-linecap: round;
  }

  /* 系统里设了「减少动态效果」的人：不浮动、不翻帧、不轮播、进度条常亮。
     秒数照常走——那是信息，不是装饰。 */
  @media (prefers-reduced-motion: reduce) {
    .work-stage { animation: none; }
    .pose { animation: none; transition: none; }
    .work-progress i { width: 100%; opacity: .45; animation: none; }
    .queue .q-node i { transition: none; }
    .dot { transition: none; }
  }

  /* ---------- 底栏 ---------- */
  footer {
    flex: 0 0 auto; display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
    background: var(--glass); border-top: 1px solid var(--line);
    -webkit-backdrop-filter: blur(14px) saturate(1.1);
    backdrop-filter: blur(14px) saturate(1.1);
  }
  #input {
    flex: 1 1 auto; resize: none; min-height: 42px; max-height: 140px;
    padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--line);
    background: var(--panel-2); color: var(--fg); font: inherit; font-size: 16px;
    line-height: 1.5; outline: none;
  }
  #input:focus { border-color: var(--ice); }
  /* 发送键是这一屏**唯一的暖金**（另一处是刻度上"正在跑的那一步"）。
     金色底配白字读不清，所以字用近黑的 --on-act。（浅色下 --act 是宝蓝、--on-act 是白字。） */
  .send {
    flex: 0 0 auto; height: 42px; padding: 0 16px; border-radius: var(--r);
    border: none; background: var(--act); color: var(--on-act);
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .send:disabled { opacity: .4; }

  /* ---------- 上传附件 ---------- */
  .attach {
    flex: 0 0 auto; width: 42px; height: 42px; padding: 0; border-radius: var(--r);
    border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .attach svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .attach:disabled { opacity: .4; }
  /* 上传中：图标转起来。这条路上没有进度条，至少要让人看出「它在动」。 */
  .attach.busy svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 附件小条：排在输入框上面，让你发之前看得见自己带了什么。 */
  .attach-bar {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px;
    padding: 8px 12px 0; background: var(--glass); border-top: 1px solid var(--line);
    -webkit-backdrop-filter: blur(14px) saturate(1.1);
    backdrop-filter: blur(14px) saturate(1.1);
  }
  .attach-bar[hidden] { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    padding: 5px 6px 5px 10px; border-radius: var(--r);
    border: 1px solid var(--line); background: var(--panel-2);
    font-size: 12.5px; color: var(--fg);
  }
  .chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 42vw; }
  .chip .sz { color: var(--muted); flex: none; }
  .chip .x {
    flex: none; width: 20px; height: 20px; padding: 0; border-radius: 50%;
    border: none; background: transparent; color: var(--muted);
    font-size: 15px; line-height: 1; cursor: pointer;
  }
  .chip.failed { border-color: var(--danger, #dc2626); }

  /* ---------- 指令菜单（在输入框里打 / 时弹出来的那个列表） ----------
     排在底栏**上面**，不挡住输入框：手机屏幕就那么大，把它盖住，用户就看不见自己
     正在打的那一行字了——手机上没有悬停，也没有第二个地方能看。 */
  .cmd-menu {
    flex: 0 0 auto; max-height: 42vh; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 6px 8px; background: var(--glass); border-top: 1px solid var(--line);
    -webkit-backdrop-filter: blur(14px) saturate(1.1);
    backdrop-filter: blur(14px) saturate(1.1);
  }
  .cmd-menu[hidden] { display: none; }
  .cmd-menu .cmd-row {
    display: flex; align-items: baseline; gap: 10px; width: 100%;
    padding: 9px 8px; border: none; border-radius: var(--r); background: none;
    color: var(--fg); font: inherit; font-size: 14.5px; text-align: left; cursor: pointer;
  }
  .cmd-menu .cmd-row:active { background: var(--panel-2); }
  .cmd-menu .cmd-name {
    flex: 0 0 auto; color: var(--ice);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  /* 说明收成一行：这一屏是「扫一眼挑一个」，不是读文档的地方。 */
  .cmd-menu .cmd-desc {
    flex: 1 1 auto; min-width: 0; color: var(--muted); font-size: 12.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* 取不到指令时说清原因，**不显示空列表**：空列表看着就像「这个会话没有指令」，
     而真实原因多半是「这个会话现在没在跑」——两件事，用户能做的事也不一样。 */
  .cmd-menu .cmd-note { padding: 10px 8px; color: var(--muted); font-size: 13px; }

  /* ---------- 左侧导航栏 ---------- */
  #nav {
    position: fixed; inset: 0; z-index: 60; display: none;
    background: rgba(4, 7, 11, .62);
  }
  #nav.open { display: block; }
  .nav-panel {
    position: absolute; top: 0; bottom: 0; left: 0; width: min(86vw, 350px);
    display: flex; flex-direction: column;
    background: var(--glass); border-right: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-backdrop-filter: blur(14px) saturate(1.1);
    backdrop-filter: blur(14px) saturate(1.1);
    /* 原来抽出来时有一条 0.18s 的滑入（`navIn`），2026-09-27 删掉：
       状态变化是瞬时的，抽屉不该表演怎么出现。 */
  }
  .nav-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--line);
    font-weight: 600;
  }
  .nav-head > span:first-child { flex: 1 1 auto; }
  .nav-body { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .nav-body .placeholder { padding: 24px 16px; font-size: 14px; }

  .ws { border-bottom: 1px solid var(--line); }
  .ws-head {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 12px 14px; background: none; border: none; color: var(--fg);
    font: inherit; font-size: 14.5px; text-align: left; cursor: pointer;
  }
  .ws-head .caret {
    flex: 0 0 auto; color: var(--muted); font-size: 10px;
    transition: transform .15s;
  }
  .ws.open .ws-head .caret { transform: rotate(90deg); }
  .ws-head .ws-title { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-head .ws-count { flex: 0 0 auto; color: var(--muted); font-size: 12px; }
  .ws-body { display: none; }
  .ws.open .ws-body { display: block; }

  .sess {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 10px 14px 10px 30px; background: none; border: none; color: var(--fg);
    font: inherit; font-size: 14px; text-align: left; cursor: pointer;
  }
  .sess:active { background: var(--panel-2); }
  /* "当前会话"用左边一条 2px 冰蓝线，不用投影：层次靠细线，不靠阴影。 */
  .sess.cur { background: var(--panel-2); border-left: 2px solid var(--ice); }
  .sess .s-title { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .s-meta { flex: 0 0 auto; color: var(--muted); font-size: 11.5px; }
  /* 「正在跑」这个点是**状态**，和主屏顶栏那颗是同一种意思，所以用同一个冰蓝。
     这里原来跟着暖金走，结果抽屉一屏能出现三处金（两个点 + 「就在这个工作区」），
     破了"一屏最多两处"。金只留给"该动手的地方"和"当前这一步"。 */
  .sess .s-dot, .ws-head .s-dot {
    flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%;
    background: var(--run);
  }
  /* 「新建会话」那一行。跟会话条目同宽、同缩进，但用强调色——
     它不是一个会话，是一个动作。长得跟会话一样会让人以为点进去就是那条会话。 */
  .ws-new {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 10px 14px 10px 30px; background: none; border: none;
    color: var(--ice); font: inherit; font-size: 14px; text-align: left; cursor: pointer;
  }
  .ws-new:active { background: var(--panel-2); }
  .ws-new[disabled] { color: var(--muted); cursor: default; }

  /* 导航栏最上面那条「新建工作区」。跟工作区条目之间用一条线隔开：
     它是这一屏的入口，不是一个工作区。 */
  .nav-cta {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 12px 14px; background: none; border: none; border-bottom: 1px solid var(--line);
    color: var(--ice); font: inherit; font-size: 14px; text-align: left; cursor: pointer;
  }
  .nav-cta:active { background: var(--panel-2); }

  /* 面包屑。横向能划，路径再深也不会把面板撑破。 */
  .crumb {
    display: flex; align-items: center; gap: 2px; padding: 8px 10px;
    overflow-x: auto; white-space: nowrap; border-bottom: 1px solid var(--line);
  }
  .crumb button {
    background: none; border: none; color: var(--ice); font: inherit;
    font-size: 13px; padding: 4px 6px; cursor: pointer; border-radius: var(--r);
  }
  .crumb button:active { background: var(--panel-2); }
  .crumb .sep { color: var(--muted); font-size: 12px; }
  .crumb .here { color: var(--fg); font-size: 13px; padding: 4px 6px; }

  /* 「就选这个目录」——这一屏唯一的主按钮，所以给它实心底。 */
  .pick-here {
    display: block; width: calc(100% - 24px); margin: 10px 12px;
    padding: 11px; border: none; border-radius: var(--r);
    background: var(--act); color: var(--on-act); font: inherit; font-size: 14px; cursor: pointer;
  }
  .pick-here:active { opacity: .85; }
  .pick-here[disabled] { background: var(--line); color: var(--muted); cursor: default; }

  /* 新建文件夹那一行输入。内联而不是 window.prompt：prompt 在微信这类内嵌
     浏览器里会被直接屏蔽，那时候点「新建文件夹」什么都不发生、也没提示。 */
  .mkdir-row { display: flex; gap: 6px; padding: 8px 12px; align-items: center; }
  .mkdir-row input {
    flex: 1 1 auto; min-width: 0; padding: 9px 10px; font: inherit; font-size: 14px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--r); color: var(--fg);
  }
  .mkdir-row button {
    flex: 0 0 auto; padding: 9px 12px; font: inherit; font-size: 13px; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--r); color: var(--fg);
  }
  .mkdir-row button:active { background: var(--line); }

  /* 「完全权限」那一档的待确认状态：点一次先变成这样，再点一次才真切。
     跟 .active（当前所在档位）用不同颜色区分——一个是「将要去」，一个是「已在」。 */
  .seg button.armed { background: var(--danger, #c0392b); color: #fff; }
  .nav-note { padding: 10px 16px; color: var(--muted); font-size: 12px; line-height: 1.6; }
  /* 「这不是全部」：垫在聊天内容最上面，往上翻到顶才看得见，不抢内容。 */
  .history-note {
    margin: 0 0 14px; padding: 8px 12px; border: 1px dashed var(--line);
    border-radius: var(--r); color: var(--muted); font-size: 12.5px; line-height: 1.6;
  }
  /* 「上面还有更早的」：聊天记录是一屏一屏铺的（见 renderChat 里 CHAT_PAGE 那段）。
     两处讲究：
     · **贴在看得到的顶上**（sticky），不随内容走——随内容走就只在滑到顶那一瞬间可见，
       而那一瞬间正好触发了自动再放一屏，那句话等于永远看不见。
     · **离顶远了就收起来**（.hide）。用户 2026-09-30 真机提的：都滑到最下面了，
       它还挂在顶上。那时候上面确实还有没放出来的记录，这句话没说错；但它是催人
       往上滑的，人已经在底部读内容了，挂在顶上就只剩挡视线。
     长相照抄底栏的 .chip，不为它新造一种元素。 */
  .more-note {
    position: sticky; top: 0; z-index: 1;
    width: fit-content; margin: 0 auto 14px; padding: 4px 12px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--muted); font-size: 12px; line-height: 1.7;
  }
  /* 收起来用 visibility 而不是 display：这一条的高度始终留在内容里，
     露和收之间就不会把下面的消息顶来顶去（那会是一次小跳）。 */
  .more-note.hide { visibility: hidden; }

  /* ---------- 设置抽屉 ---------- */
  #settings {
    position: fixed; inset: 0; background: var(--scrim);
    display: none; align-items: flex-end; z-index: 50;
  }
  #settings.open { display: flex; }
  .sheet {
    width: 100%; max-height: 86vh; overflow-y: auto;
    background: var(--glass); border-radius: var(--r) var(--r) 0 0;
    padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px);
    border-top: 1px solid var(--line);
    -webkit-backdrop-filter: blur(14px) saturate(1.1);
    backdrop-filter: blur(14px) saturate(1.1);
  }
  .sheet h2 { margin: 0 0 14px; font-size: 16px; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .row:last-of-type { border-bottom: none; }
  .row .label { font-size: 15px; }
  .row .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
  /* flex-shrink: 0 不能省。它是弹性项，左边的说明文字一长就会被压缩；
     而它自己带着 overflow: hidden，所以被压掉的那一段不是跑到屏幕外，是**被裁掉**——
     2026-09-25 用户截图里那个「关」字就是这么没的。 */
  .seg { display: flex; flex-shrink: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .seg button {
    padding: 7px 12px; border: none; background: var(--panel-2); color: var(--muted);
    font-size: 13px; cursor: pointer;
  }
  .seg button.active { background: var(--ice); color: var(--on-act); }
  select, .btn {
    padding: 8px 12px; border-radius: var(--r); border: 1px solid var(--line);
    background: var(--panel-2); color: var(--fg); font: inherit; font-size: 14px;
  }
  .btn { cursor: pointer; }
  .btn.primary { background: var(--act); border-color: var(--act); color: var(--on-act); font-weight: 600; }
  .sheet .foot { margin-top: 18px; display: flex; gap: 10px; }
  .sheet .foot .btn { flex: 1 1 0; text-align: center; }

  /* ---------- token 输入 ---------- */
  #gate { position: fixed; inset: 0; background: var(--bg); z-index: 100;
          display: none; flex-direction: column; justify-content: center;
          padding: 24px; gap: 14px; }
  #gate.open { display: flex; }
  #gate h1 { font-size: 20px; margin: 0; }
  #gate p { color: var(--muted); font-size: 14px; margin: 0; }
  #gate input {
    padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line);
    background: var(--panel-2); color: var(--fg); font: inherit; font-size: 16px;
  }
  #gate button {
    padding: 13px; border-radius: var(--r); border: none; background: var(--act);
    color: var(--on-act); font-size: 16px; font-weight: 600;
  }
  #gate .err { color: var(--err); font-size: 13px; min-height: 18px; }

  #toast {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(8px);
    background: var(--pop); color: var(--fg); padding: 9px 16px;
    border-radius: var(--r); font-size: 13.5px; opacity: 0; pointer-events: none;
    border: 1px solid var(--line);
    transition: opacity .2s, transform .2s; z-index: 200; max-width: 86vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ——— 回答电脑提问的卡片 ———
     整屏遮住聊天区：手机上一次只专心答一题，答完自动消失。
     之所以遮全屏而不是弹个小条：非技术用户看到"电脑在等你回答"时，
     最怕的是不知道该点哪里；整屏只剩问题本身和按钮，没有第二个选择。 */
  /* 命令确认（审批）卡。形状与理由都同上面那张答题卡：整屏遮住，只剩「同意 / 拒绝」
     两个选择。**主题交给令牌决定**——主按钮那一处用的就是「当底的强调色」令牌，
     面板、文字、描边全沿用现有那几档，所以深色浅色自动都对，不用为两套主题各写一份。
     （注释里**不写令牌本身那串字**：下面的检查是按"哪一块里出现了它"取材的，
     注释里写上，这一块就会被当成一条规则，取自一个不存在的选择器。） */
  #approveCard { position: fixed; inset: 0; z-index: 310; background: var(--bg);
    display: none; flex-direction: column; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); overflow-y: auto; }
  #approveCard.on { display: flex; }
  #approveCard .ahead { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  #approveCard .atool { font-size: 18px; line-height: 1.6; margin-bottom: 10px; }
  #approveCard .areason { font-size: 14px; line-height: 1.65; color: var(--muted); margin-bottom: 16px; white-space: pre-wrap; }
  /* 命令原文：等宽感靠 1px 细线左边界和缩进，不引新字体；长命令照原样折行。 */
  #approveCard .acmd { font-size: 13px; line-height: 1.55; color: var(--muted); margin-bottom: 16px;
    white-space: pre-wrap; word-break: break-all; border-left: 2px solid var(--line); padding-left: 10px; }
  #approveCard .afoot { margin-top: auto; display: flex; gap: 10px; padding-top: 16px; }
  #approveCard .afoot button { flex: 1; padding: 15px 8px; font-size: 16px; border-radius: var(--r);
    border: 1px solid var(--line); background: var(--panel-2); color: inherit; font-family: inherit; }
  /* 这一屏唯一的主按钮走 --act：深色下暖金，浅色下宝蓝配白字。 */
  #approveCard .afoot button#approveAllow { background: var(--act); border-color: var(--act); color: var(--on-act); font-weight: 600; }
  #askCard { position: fixed; inset: 0; z-index: 300; background: var(--bg);
    display: none; flex-direction: column; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); overflow-y: auto; }
  #askCard.on { display: flex; }
  #askCard .qhead { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  #askCard .qtext { font-size: 18px; line-height: 1.6; margin-bottom: 10px; }
  #askCard .qdetail { font-size: 14px; line-height: 1.65; color: var(--muted); margin-bottom: 16px; white-space: pre-wrap; }
  #askCard .opt { display: block; width: 100%; text-align: left; margin: 0 0 10px; padding: 15px 16px;
    font-size: 16px; line-height: 1.5; border-radius: var(--r); border: 1px solid var(--line);
    background: var(--panel-2); color: inherit; font-family: inherit; }
  /* 选中的那一条用冰蓝描边：它是"你选的"，不是"你要按的主按钮"——主按钮是暖金。 */
  #askCard .opt.sel { border-color: var(--ice); background: rgba(169, 200, 232, .1); }
  #askCard .opt small { display: block; color: var(--muted); font-size: 13px; margin-top: 5px; }
  #askCard textarea { width: 100%; box-sizing: border-box; font-size: 16px; line-height: 1.6;
    border-radius: var(--r); border: 1px solid var(--line); background: var(--panel-2); color: inherit;
    padding: 12px; font-family: inherit; resize: vertical; }
  #askCard .qfoot { margin-top: auto; display: flex; gap: 10px; padding-top: 16px; }
  #askCard .qfoot button { flex: 1; padding: 15px 8px; font-size: 16px; border-radius: var(--r);
    border: 1px solid var(--line); background: var(--panel-2); color: inherit; font-family: inherit; }
  /* 这一屏唯一的主按钮，暖金。 */
  #askCard .qfoot button#askNext { background: var(--act); border-color: var(--act); color: var(--on-act); font-weight: 600; }
  /* 没有毛玻璃的浏览器：退回实色面板。别让界面变成一片糊住的半透明。 */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    header, footer, .attach-bar, .cmd-menu, .nav-panel, .sheet { background: var(--panel); }
  }
  /* 细线图标：和回形针、复制按钮那套同一副笔法（1.5px 描边、圆头圆角）。 */
  .icon-btn svg {
    width: 18px; height: 18px; fill: none; stroke: currentColor;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  }
</style>
<script>
  // 主题必须在**首屏画出来之前**定下来，否则浅色手机打开会先闪一下深色底。
  // 所以这一段留在 <head> 里、样式表后面，**别挪到页面底部那段脚本区去**。
  (function () {
    try {
      var pick = localStorage.getItem('dshMiniTheme') || 'dark';
      var dark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme',
        pick === 'auto' ? (dark ? 'dark' : 'light') : pick);
    } catch (e) { /* 无痕模式下 localStorage 会抛；按默认深色走，不影响页面 */ }
  })();
</script>
</head>
<body>

<!-- 电脑提问时弹出来的答题卡片。默认隐藏，收到 question 事件才显示。 -->
<div id="askCard">
  <div class="qhead" id="askHead"></div>
  <div class="qtext" id="askText"></div>
  <div class="qdetail" id="askDetail"></div>
  <div id="askOpts"></div>
  <div id="askCustomWrap" style="display:none;margin-bottom:10px">
    <textarea id="askCustom" rows="3" placeholder="用你自己的话回答……"></textarea>
  </div>
  <div class="qfoot">
    <button id="askBack" type="button">上一题</button>
    <button id="askOwn" type="button">我自己说</button>
    <button id="askNext" type="button">下一题</button>
  </div>
</div>
<!-- 电脑要做需要拍板的事时弹出来的审批卡。默认隐藏，收到 approval 事件才显示。
     命令原文来自会话事件 tool/call 的 arguments（模型原样产出的 JSON），
     插件按调用编号记着，审批来的时候一起推过来。 -->
<div id="approveCard">
  <div class="ahead">电脑被拦下来了，等你拍板</div>
  <div class="atool" id="approveTool"></div>
  <div class="areason" id="approveReason"></div>
  <div class="acmd" id="approveCmd"></div>
  <div class="afoot">
    <button id="approveDeny" type="button">拒绝</button>
    <button id="approveAllow" type="button">同意</button>
  </div>
</div>

<header>
  <button class="icon-btn" id="btnNav" aria-label="工作区与会话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <span class="dot" id="dot"></span>
  <span class="brand">极简遥控器</span>
  <span class="status" id="status">连接中…</span>
  <button class="icon-btn" id="btnSubagents" aria-label="子智能体"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 12H11M11 6v12M11 6h4.8M11 18h4.8"/><circle cx="6" cy="12" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="18" cy="18" r="2.2"/></svg></button>
  <button class="icon-btn" id="btnSettings" aria-label="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h8M16 7h4M4 17h4M12 17h8"/><circle cx="14" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button>
</header>

<!-- 模型与思考强度（2026-09-25 用户要求：手机上要能改每个会话的模型和强度）。

     现在两件事都在了：顶部那一行显示当前用的模型，**点它弹出面板可以改**。
     面板里的强度只画当前模型自己声明的档位；模型不支持调强度时那一行不出现。

     **整段是自包含的**：自己的 script 标签、自己的请求、自己的元素，不碰页面现有的
     任何代码。唯一的对外依赖是 /mini/api/models 那条接口（已经验过真数据）。
     这样即使这段整个坏掉，也不会影响已经能用的部分。

     没拿到数据之前整条藏着——**宁可什么都不显示，也不显示一个占位的假值**。 -->
<div id="modelBar" style="display:none;align-items:center;gap:8px;padding:6px 12px;font-size:12px;color:var(--dim,#888);border-bottom:1px solid var(--line,#e5e5e5)">
  <span id="modelBarText"></span>
</div>

<main id="main">
  <div id="reply"></div>
  <!-- 「正在执行」是常驻元素，不参与 #reply 的整块重绘。
       拼进重绘里的话，每次状态广播都会把它重建一次，轮播和浮动动画会一直从头开始。 -->
  <div id="work" class="work" hidden>
    <div class="work-top">
      <div class="work-stage" id="workStage"></div>
      <div class="work-bubble" id="workBubble">正在执行…</div>
    </div>
    <div class="work-progress"><i></i></div>

<script>
(function () {
  'use strict';

  var DEFAULT_MODE = '__DEFAULT_MODE__';
  var NEEDS_TOKEN = __NEEDS_TOKEN__;
  // 构建指纹，由服务端注入。拼在立绘地址后面，换了图浏览器就不会一直用缓存那张。
  var BUILD = '__BUILD__';
  // 单个文件的大小上限（字节），由服务端注入。页面里不写第二份——两处各写一个数，
  // 迟早会不一致，而那时候的表现是「页面让你传，服务端拒绝」。
  var MAX_UPLOAD = __MAX_UPLOAD__;

  // ---------------- 状态 ----------------
  var params = new URLSearchParams(location.search);
  var state = {
    token: params.get('token') || localStorage.getItem('dshMiniToken') || '',
    mode: localStorage.getItem('dshMiniMode') || DEFAULT_MODE || 'minimal',
    // 外观：'dark' | 'light' | 'auto'。默认深色——不给老用户换掉现在的样子；
    // 要浅色或跟着系统走，去设置页「外观」点一下。
    theme: localStorage.getItem('dshMiniTheme') || 'dark',
    sound: localStorage.getItem('dshMiniSound') !== 'off',
    // 锁屏也能提醒（系统通知）。默认关着——它要用户主动点一下才会申请权限，
    // 不能替他决定。明文连接下这一项永远是空转的，见下面「锁屏也能提醒」那一段。
    notify: localStorage.getItem('dshMiniNotify') === 'on',
    running: false,
    sessions: [],
    // 排队中的指令（[{ id, text, placement }]）。跑着任务时接着发的那几条排在这儿，
    // 由服务端每次取快照时从 agent 的收件箱现读，手机不自己记。
    queued: [],
    boundSessionId: null,
    connected: false,
    lastReplyStamp: 0,
    // 传好了、还没发出去的文件（[{ uploadId, name, bytes }]）。
    // 只存服务端发回来的那张小票，不存附件本身——真正的东西已经在电脑上了。
    uploads: [],
    // 正在流出来的那一段。空字符串 = 这会儿没有东西要显示。
    live: '',
    /**
     * 模型此刻的自言自语（鲸鱼娘的台词）：{ text, at } 或 null。
     *
     * **和 live 严格分开**：live 非空时整块 #work 会让位（那是「回答正在往外冒」的
     * 规矩），台词要是塞进 live，会出现「该说话的时候鲸鱼娘不见了」。
     * 它也不进 #reply——2026-09-22 用户否掉的就是「过程的文字跑进回答区」。
     */
    thought: null,
    // 服务端正去读这个会话的完整记录（点开一个插件没看过的会话时会有这一下）。
    historyLoading: false,
    // 「这份历史只到最近一段」（服务端读历史有上限时会给这一句）。
    historyTruncated: false,
    historyNote: '',
    // 斜杠指令的列表（在输入框里打 / 时弹出来的那个菜单）。
    // **按绑定的会话缓存**：指令表是每个会话一份的，而这个会话没在跑时服务端一条都
    // 读不到（回 ok:false + 一句话）。所以换了会话必须重取——否则用户点到的是上一个
    // 会话的指令，点下去必然被拒，而他从屏幕上完全看不出为什么。
    commands: null,        // null = 还没取到
    commandsError: '',     // 取不到时服务端给的那句话，原样显示给用户
    commandsFor: null,     // 上面这份数据是哪个会话的
    commandsLoading: false // 正在取（挡住重复请求，见 loadCommands）
  };
  if (params.get('token')) {
    localStorage.setItem('dshMiniToken', params.get('token'));
    // 别把 token 留在地址栏里，避免被截图/分享带出去。
    history.replaceState(null, '', location.pathname);
  }

  var $ = function (id) { return document.getElementById(id); };
  var mainEl = $('main'), replyEl = $('reply'), inputEl = $('input');
  var dotEl = $('dot'), statusEl = $('status');

  // ---------------- 小工具 ----------------
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // 复制按钮的两个图标。做成常量而不是散在各处：以后换图标只改这一处。
  // 形状（两个重叠的方框）和配色都在 CSS 的 .copy 里，这里只管画线。
  var ICON_COPY = '<svg viewBox="0 0 16 16" aria-hidden="true">'
    + '<rect x="5.6" y="1.6" width="8.8" height="8.8" rx="2.2"/>'
    + '<rect x="1.6" y="5.6" width="8.8" height="8.8" rx="2.2"/></svg>';
  var ICON_DONE = '<svg viewBox="0 0 16 16" aria-hidden="true">'
    + '<path d="M2.6 8.4l3.6 3.6 7.2-7.2"/></svg>';
  function linkify(text) {
    return escapeHtml(text).replace(/(https?:\/\/[^\s<]+)/g, function (u) {
      return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>';
    });
  }

  // ---------------- Markdown 渲染 ----------------
  // 手写的最小实现，不引依赖（这个页面是单文件、免构建的）。
  //
  // 顺序不能换：**先转义，再上标签**。模型吐出来的东西一律当纯文本，
  // 只把它写成的那几种语法变成 HTML——绝不让原文里的标签生效。
  // 认不出来的语法原样留着：宁可少渲染，不能吃掉内容。
  var CODE_SLOT = '\u0000';

  /**
   * 正文里的图片地址 → 真正去取的地址。三种写法见下面 mdInline 那段注释。
   *
   * 判据只有一条：**不是 http(s) 就走同源**。所以 `javascript:`、`data:` 这类
   * 永远不会出现在 src 里；认不出的地址最多是取回来 404，不会变成别的东西。
   *
   * 放在这里而不是立绘那一段（artUrl 旁边）：页面测试是从 escapeHtml 抠到复制按钮
   * 那一小段的，放外面就测不到真代码了。
   */
  function imageSrc(src) {
    if (/^https?:\/\//i.test(src)) return src;
    var name = src.replace(/\\/g, '/').replace(/^\.\//, '');
    if (/^lib\/art\//i.test(name)) name = name.slice(8);
    if (/^[a-z0-9-]+(\.webp)?$/i.test(name)) return artUrl(name.replace(/(\.webp)?$/i, ''));
    return '/mini/art/?p=' + encodeURIComponent(src)
      + '&token=' + encodeURIComponent(state.token);
  }

  function mdInline(raw) {
    // 行内代码先挖出来换成占位符。不这么做的话，`**x**` 这种字面量
    // 会被后面的粗体规则吃掉，代码里写的东西就显示错了。
    var codes = [];
    var out = escapeHtml(raw).replace(/`([^`]+)`/g, function (_, code) {
      codes.push(code);
      return CODE_SLOT + (codes.length - 1) + CODE_SLOT;
    });
    out = out
      // 图片：![说明](地址)。地址三种写法，判断在 imageSrc 里——
      //   ① 完整 http(s) 链接：原样用，手机直接去那个网站取图；
      //   ② 一个名字（如 out-demo，`.webp` 可带可不带）：走立绘通道 /mini/art/<名字>.webp，
      //      只认 lib/art/ 下「小写字母数字连字符 + .webp」的文件名；写成
      //      `lib/art/out-demo.webp` 这样带前缀的也认（2026-09-28 助手这么写过，手机上成了破图标）；
      //   ③ 电脑上一张图的位置（绝对路径，或相对项目根）：走 /mini/art/?p=…，PNG/JPG/WEBP/GIF 都行，
      //      不要求先拷进 lib/art。
      // 三者之外的一律按 ③ 拼成同源路径，所以 `javascript:`、`data:` 这类进不了 src。
      // 必须排在下面那条链接规则前面：否则 `![x](y)` 里的 `[x](y)` 会先被链接规则
      // 吃掉，只剩下一个光秃秃的感叹号。
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (_, alt, src) {
        return '<img class="md-img" src="' + imageSrc(src) + '" alt="' + alt + '"'
          + ' loading="lazy" referrerpolicy="no-referrer">';
      })
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,
        '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
    return out.replace(new RegExp(CODE_SLOT + '(\\d+)' + CODE_SLOT, 'g'), function (_, i) {
      return '<code>' + codes[+i] + '</code>';
    });
  }

  function codeBlock(raw, lang) {
    // data-copy 里放转义后的原文，读回来时浏览器会自动还原成原始字符。
    var attr = escapeHtml(raw);
    return '<div class="code"><div class="code-head">'
      + (lang ? '<span class="lang">' + escapeHtml(lang) + '</span>' : '<span></span>')
      + '<button class="copy" type="button" aria-label="复制代码" title="复制代码"'
      + ' data-copy="' + attr + '">' + ICON_COPY + '</button></div>'
      + '<pre><code>' + attr + '</code></pre></div>';
  }

  function isBlockStart(line) {
    return /^\s*```/.test(line)
      || /^\s*#{1,6}\s/.test(line)
      || /^\s*[-*+]\s/.test(line)
      || /^\s*\d+[.)]\s/.test(line)
      || /^\s*>/.test(line)
      || /^\s*\|/.test(line)
      || /^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(line);
  }

  function mdToHtml(src) {
    var lines = String(src).split('\n');
    var html = [];
    var i = 0;
    while (i < lines.length) {
      var line = lines[i];

      // 围栏代码块：内容只转义，不走行内规则
      var fence = /^\s*```\s*([\w+#.-]*)\s*$/.exec(line);
      if (fence) {
        var buf = [];
        i += 1;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { buf.push(lines[i]); i += 1; }
        i += 1;
        html.push(codeBlock(buf.join('\n'), fence[1]));
        continue;
      }

      if (!line.trim()) { i += 1; continue; }

      var h = /^\s*(#{1,6})\s+(.*)$/.exec(line);
      if (h) {
        var n = h[1].length;
        html.push('<h' + n + '>' + mdInline(h[2]) + '</h' + n + '>');
        i += 1;
        continue;
      }

      if (/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(line)) { html.push('<hr>'); i += 1; continue; }

      if (/^\s*[-*+]\s+/.test(line)) {
        var ul = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
          ul.push('<li>' + mdInline(lines[i].replace(/^\s*[-*+]\s+/, '')) + '</li>');
          i += 1;
        }
        html.push('<ul>' + ul.join('') + '</ul>');
        continue;
      }

      if (/^\s*\d+[.)]\s+/.test(line)) {
        var ol = [];
        while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
          ol.push('<li>' + mdInline(lines[i].replace(/^\s*\d+[.)]\s+/, '')) + '</li>');
          i += 1;
        }
        html.push('<ol>' + ol.join('') + '</ol>');
        continue;
      }

    work.speakText = t.text;
    // 每来一句新的就从这一刻重新算：时长按这句话有多长来（见 speakDuration）。
    work.speakUntil = Date.now() + speakDuration(t.text);
    paintSpeak(t.text);
  }

  function elapsedLabel(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    if (s < 60) return '已 ' + s + ' 秒';
    return '已 ' + Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒';
  }

  function tickElapsed() {
    $('workElapsed').textContent = elapsedLabel(Date.now() - work.startedAt);
  }

  /** 立绘在页面一打开就全部加载好——不然第一次「正在执行」会闪一下空白。 */
  function preloadPoses() {
    var stage = $('workStage');
    stage.innerHTML = '';
    work.layers = [];
    for (var i = 0; i < POSES.length; i += 1) {
      var layer = document.createElement('div');
      layer.className = 'pose';
      // 帧数决定显示宽度和用哪套关键帧（CSS 里 2 帧是默认，6 帧挂在 [data-frames="6"]）。
      // **时长不跟着帧数放大**：一圈还是 flip 秒，这样腿脚换帧的快慢跟以前一样。
      layer.setAttribute('data-frames', POSES[i].frames || 2);
      layer.style.backgroundImage = 'url("' + artUrl(POSES[i].file) + '")';
      layer.style.animationDuration = POSES[i].flip + 's';
      stage.appendChild(layer);
      work.layers.push(layer);
      // #work 是 hidden（display:none），浏览器**不会**为它下载背景图。
      // 所以这里得拿一个游离的 <img> 主动拉一次，否则第一次「正在执行」会先闪空白。
      var warm = document.createElement('img');
      warm.src = artUrl(POSES[i].file);
    }
    // 说话那张一起建好、一起预热：等台词来了再新建图层，会说第一个字之前先闪一下空白。
    var speak = document.createElement('div');
    speak.className = 'pose';
    speak.setAttribute('data-frames', SPEAK_POSE.frames || 2);
    speak.style.backgroundImage = 'url("' + artUrl(SPEAK_POSE.file) + '")';
    speak.style.animationDuration = SPEAK_POSE.flip + 's';
    stage.appendChild(speak);
    work.speakLayer = speak;
    var warmSpeak = document.createElement('img');
    // 说话那张要是加载不出来（图还没画好、或者网络半路断了）：**别把舞台清空**。
    // 默认按「图在」处理，只有真报错才翻成 false——正常路径一个字都不变；
    // 翻成 false 之后就退成「台词照说、人照轮播」，而不是她整个消失（见 paintSpeak）。
    warmSpeak.onerror = function () { work.speakReady = false; };
    warmSpeak.src = artUrl(SPEAK_POSE.file);
    paintPose(0);
  }

  /**
   * 轮播往前走一步，然后按**这一步是什么**决定下次隔多久。
   *
   * 原来是一个固定的 setInterval，每 3.6 秒换一张。现在冲刺要停得短，
   * 固定间隔就做不到——所以改成自己排下一次的 setTimeout。
   * 停止时 stopWork 会把待排的那一次清掉，不会漏跑。
   */
  function nextPose() {
    // 正在说话：这一格让给她，轮播停在这儿等（work.pose 不动，所以恢复时接着的那一格
    // 就是被打断的那一格，而不是从头来）。到点或来了新台词都由 maybeSpeak 管。
    if (work.speakUntil) {
      var left = work.speakUntil - Date.now();
      if (left > 0) {
        paintSpeak(work.speakText);
        // 睡到「该收尾的那一刻」为止，不多不少：按 3.6 秒一格睡的话，
        // 这个上限会被拖到整格之后，最后那句台词要多挂将近一秒。
        work.poseTimer = setTimeout(nextPose, Math.min(POSE_MS, left));
        return;
      }
      work.speakUntil = 0;
      work.speakText = '';
    }
    var seq = poseSequence();
    work.pose = (work.pose + 1) % seq.length;
    var index = seq[work.pose];
    paintPose(index);
    work.poseTimer = setTimeout(nextPose, POSES[index].gap ? GAP_MS : POSE_MS);
  }

  function startWork() {
    // 已经在跑就别重来。状态广播来得很密，每次重置的话姿态会永远卡在第一张。
    if (work.startedAt) return;
    work.startedAt = Date.now();
    work.pose = 0;
    paintPose(0);
    tickElapsed();
    work.tickTimer = setInterval(tickElapsed, 1000);
    if (reducedMotion) return;   // 关掉动画的人就停在一张上，秒数照常走
    work.poseTimer = setTimeout(nextPose, POSE_MS);
  }

  /** 停止请求的兜底计时器。放在 stopWork 前面，别靠 var 提升兜着。 */
  var stopTimer = null;

  function stopWork() {
    work.startedAt = 0;
    // 说话状态跟着收掉：这一轮的话已经说完了，下一轮不该接着上一句。
    // **但 speakAt 留着**——那是对「哪句话已经念过」的记忆，清掉的话，万一宿主侧
    // 还留着上一轮的台词（广播没到），新一轮一开场它就会被当成新话说一遍。
    work.speakUntil = 0;
    work.speakText = '';
    // 轮播现在是自己排下一次的 setTimeout（见 nextPose），用 clearInterval 清
    // setTimeout 在浏览器里也行，但写 clearTimeout 更不容易让人误会。
    if (work.poseTimer) { clearTimeout(work.poseTimer); work.poseTimer = null; }
    if (work.tickTimer) { clearInterval(work.tickTimer); work.tickTimer = null; }
    // 跑完了就把按钮复位，下一次「正在执行」才是干干净净的一个「停止」。
    if (stopTimer) { clearTimeout(stopTimer); stopTimer = null; }
    paintStop(false);
  }

  // ---------------- 停止 ----------------
  //
  // cancel() 在服务端只是**递个请求**，不是「等它停」——真正停下要等驱动收敛，
  // 到那时候服务端才把 running 翻成 false 推过来。所以按下去之后按钮自己禁用、
  // 改文案，等那个状态翻：既让人看见「按到了」，也防连按好几下。
  function paintStop(stopping) {
    var b = $('btnStop');
    b.disabled = stopping;
    b.textContent = stopping ? '正在停…' : '停止';
  }

  function requestStop() {
    var b = $('btnStop');
    if (!state.running || b.disabled) return;
    paintStop(true);
    api('/mini/api/stop', { method: 'POST', body: '{}' })
      .then(function () {
        // 正常情况：几百毫秒内 status 事件就到了，stopWork() 会把按钮复位。
        // 但万一那一刻连接正好断了，就会永远卡在「正在停…」——留个兜底，
        // 十秒还没翻就把按钮放回去，让人能再按一次，而不是干瞪眼。
        stopTimer = setTimeout(function () {
          stopTimer = null;
          if (state.running) {
            paintStop(false);
            toast('还没停下来。可以再按一次，或者到电脑上看看。');
          }
        }, 10000);
      })
      .catch(function (err) {
        paintStop(false);
        toast(err.message || '停止失败');
      });
  }

  $('btnStop').addEventListener('click', requestStop);

  /**
   * 把手机上答的题交回电脑，回一句实话。
   *
   * 回的是三种结果，不是一个「成没成」——因为两种失败要说不同的话：
   *   'ok'      电脑收下了；
   *   'late'    这题已经交回电脑了（插件回 409），得让用户去电脑上答；
   *   'failed'  压根没发出去（连不上），卡片留着，手一按还能再试。
   *
   * 原来那一段是按下就先把卡片收掉、发失败也咽着不说（当时的理由是「电脑那边等不到
   * 会自己还给浏览器」）。可电脑那边还在等着，手机上却静悄悄——用户看到的只有
   * 「我点了，没反应」（2026-09-27 用户报的正是这一幕）。所以这里只做一件事：
   * 把实情如实报出来，怎么显示由上面那张卡片决定。
   */
  function sendAnswer(id, answers) {
    return api('/mini/api/answer', {
      method: 'POST',
      body: JSON.stringify({ id: id, answers: answers }),
    })
      .then(function () { return 'ok'; })
      .catch(function (err) {
        return err && err.status === 409 ? 'late' : 'failed';
      });
  }


  /** 手机把审批结论交回电脑。三种结果和上面那条一样：成了 / 晚了 / 没送出去。 */
  function sendApproval(id, allow) {
    return api('/mini/api/approval', {
      method: 'POST',
      body: JSON.stringify({ id: id, decision: allow ? 'allow' : 'deny' }),
    })
      .then(function () { return 'ok'; })
      .catch(function (err) {
        return err && err.status === 409 ? 'late' : 'failed';
      });
  }
  // ---------------- 排队中的指令 ----------------
  //
  // 跑着任务时接着发的那几条不会丢，而是排进 agent 的收件箱（`followup()` 的语义
  // 就是「排队一个后续轮次」），等当前这一轮结束再跑。既然收下了，就必须让用户看见
  // 它排在哪——尤其单帧模式下，你发出去的那句话在别处**一个字都看不见**
  // （那一模式只显示回复），没有这块就等于「发出去了没反应」。
  //
  // 队列每次由服务端现读 agent 的收件箱，手机不自己记一份，所以不存在两边对不上。
  function paintQueue() {
    var el = $('queue');
    var list = state.queued || [];
    // 刻度尺上第一个点永远是**正在跑的那条**，后面每个点对应一条真排在队里的指令。
    //
    // 2026-09-27 用户裁决：**队列是空的就整块收起来，不显示。**
    // 上一版这里是「只要在跑就留着」，理由是一个金点表示"你这一轮正是第 1 步"；
    // 用户实际看到的是「排队中 0 条」配一个孤零零的点，判定为噪音。撤销。
    // （上面那段注释里"哪怕只有一格，秩序也在"的说法同样作废。）
    if (!list.length) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    // 最多画 12 个点：再长这条尺子就成噪点了，超出缀一个省略号。
    var nodes = '<div class="q-node cur"><i></i><b>1</b></div>';
    var shown = Math.min(list.length, 11);
    for (var n = 0; n < shown; n += 1) {
      nodes += '<div class="q-node"><i></i><b>' + (n + 2) + '</b></div>';
    }
    if (list.length > shown) nodes += '<div class="q-node"><i></i><b>…</b></div>';
    var rows = '';
    for (var i = 0; i < list.length; i += 1) {
      rows += '<div class="q-row">'
        + '<span class="q-text">' + escapeHtml(list[i].text) + '</span>'
        + '<button class="q-drop" type="button" data-drop="' + escapeHtml(list[i].id) + '"'
        + ' aria-label="撤掉这条"><svg viewBox="0 0 24 24" aria-hidden="true">'
        + '<path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';
    }
    el.innerHTML = '<div class="q-head">排队中 ' + list.length + ' 条 · 跑完这轮就轮到它们</div>'
      + '<div class="q-scale">' + nodes + '</div>' + rows;
  }

  /**
   * 撤掉一条还在排队的指令。
   *
   * 撤不掉是正常情况之一：手机上这份队列是上一次推送时的样子，这中间它完全可能
   * 已经轮到自己开始跑了。那时候服务端会说「撤不回来了」，这里如实转达，
   * 并且刷新一次，让界面跟上真实状态——不能假装撤掉了。
   */
  function requestUnqueue(id) {
    // 成功失败都由服务端推一份最新的队列过来（失败时也要推——见 onUnqueue 的说明），
    // 所以这里不用自己去拉，只需要把失败原因转达给用户。
    api('/mini/api/unqueue', { method: 'POST', body: JSON.stringify({ id: id }) })
      .catch(function (err) { toast(err.message || '撤不回来'); });
  }

  $('queue').addEventListener('click', function (e) {
    // **必须从被点的元素往上找到那个真按钮。** ✗ 是画在按钮里面的 SVG 图形，手指落上去
    // 时 e.target 是图形本身，读不到按钮身上的编号。用户 2026-09-28 实机报「排队框的 ✗
    // 点了没反应」就是这么来的：旧写法 `e.target.getAttribute('data-drop')` 拿到 null，
    // 然后静默什么都不做。按钮只有 24×24、图形 12×12，所以旧写法几乎必然踩中。
    var hit = e.target && e.target.closest ? e.target.closest('.q-drop') : null;
    var id = hit ? hit.getAttribute('data-drop') : null;
    if (id) { requestUnqueue(id); return; }
    // 找到了按钮却没有编号：这是代码毛病。说一声，别静默——静默失败是最难查的那一类。
    if (hit) toast('这条撤不了：没带上编号');
  });

  /** 让「正在执行」那块跟着 state.running 显隐。 */
  function paintWork() {
    var el = $('work');
    var queued = (state.queued || []).length;
    // 队列也算「还有活儿」。正常情况到不了「闲着但队列非空」（followup 总会唤醒驱动），
    // 但停掉当前这一轮之后、队列还没接上的那一小段就是这种状态——
    // 那块东西不该先消失一下再冒出来。
    //
    // 但**正在流式写回答的时候要收起来**：回答本身已经在屏幕上长出来了，
    // 底下再挂一只鲸鱼娘就是重复——用户要看的字正在往上冒，那块既占地方又抢注意力。
    // 用户 2026-09-22 实机提的：「内容开始流式生成的时候，鲸鱼娘的动画就可以消失了」。
    // 注意这里用 state.live 判断，不是「有没有在跑」——跑着但还没到吐字那一步
    // （比如正在调工具）时，鲸鱼娘还是要留着，那是它唯一该出现的时候。
    var busy = (state.running || queued > 0) && !state.live;
    el.hidden = !busy;
    if (busy) {
      startWork();
      // 台词每次随快照重算一遍。**必须放在 startWork 之后**：startWork 会先画第 0 张，
      // 反过来的话它会把这句台词盖掉，用户看到的是「收到，这就去办」而不是她的自说自话。
      maybeSpeak();
    } else stopWork();
    paintQueue();
  }

  // ---------------- 渲染 ----------------
  function setStatus(kind, text) {
    dotEl.className = 'dot ' + kind;
    statusEl.textContent = text;
  }
  function updateStatusUI() {
    if (!state.connected) { setStatus('err', '未连接'); return; }
    if (state.running) { setStatus('run', '运行中…'); return; }
    setStatus('ok', '已连接');
  }
  function setRunning(running) {
    state.running = !!running;
    // 这里原来会把输入框和发送按钮一起禁用。现在不禁了：跑着的时候**可以接着发**，
    // 那条会排队（见 send 的说明）。禁掉输入框等于把「排队」这条路从界面上封死，
    // 而 DSH 本身在跑着的时候是收的。
    updateStatusUI();
    // 放这里而不是 render() 里：SSE 的 status 事件只调 setRunning、不重绘，
    // 漏了这一处的话「运行中」变了而鲸鱼娘不出现。
    // 另外它也是**唯一**会调 paintWork 的地方，而 paintWork 还要看 state.live
    // （流式一露头就把鲸鱼娘收起来）。快照每次都带 running，所以 applySnapshot
    // 会走到这儿、live 的变化也就跟着生效了——别把这个调用挪走。
    paintWork();
  }

  /**
   * 单帧模式：「这一条回答」有没有已经带用户滚过顶了。
   *
   * **用 timestamp 当身份**，因为它是这里唯一稳定、且只在真推了一条新回答时才变的字段
   * （`pushReply` 每次都现取 `Date.now()`；重连、SSE 重推、切模式、从后台回来
   * 都只是把同一条回答重新渲染一遍，timestamp 不变）。
   *
   * 用户 2026-09-23 提的：「手机端的单帧模式，回答出现的时候，页面应该跳到顶部，
   * 方便用户阅读。」不记这个的话：一条长结论渲染出来，用户看到的是最后一行，
   * 得自己往上翻才读得到开头。
   *
   * 记成「已经为哪一条滚过顶」而不是一个「刚跳过」的布尔量，是为了不误伤上面那几种
   * 重新渲染——那些时候用户可能正读到一半，把他弹回顶部比不跳还烦人。
   * 初始值 0：开机第一次渲染时任何一条回答的 timestamp 都比它大，于是会跳一次，
   * 正好是「打开页面从最新那条的开头读起」。
   */
  var scrolledReplyAt = 0;

  function renderMinimal() {
    mainEl.classList.remove('center');
    var latest = state.latest;
    var live = state.live || '';
    var parts = [];
    // 「正在执行」不拼进这块 HTML——它是常驻的 #work，由 paintWork() 控制显隐。
    // 但它仍然显示在回答**下方**，不顶掉回答：原来它排在最前面并且直接 return，
    // 于是刚发完指令，上一步的结果就整块消失，用户看不到自己上一步得到了什么。
    if (latest && latest.text) {
      // 「已停止」留在正文**上方**：它是给正文打的预防针（你收到的只是半句），
      // 得在读到正文之前看到。
      // 复制按钮则挪到正文**下方、靠左**——原来在上面靠右，手机上拇指够不着，
      // 而且会比正文先入眼。
      var stopped = latest.interrupted ? '<span class="stopped">已停止</span>' : '';
      parts.push((stopped ? '<div class="reply-bar">' + stopped + '</div>' : '')
        + '<div class="md">' + mdToHtml(latest.text) + '</div>'
        + '<div class="reply-foot">'
        + '<button class="copy" type="button" aria-label="复制全文" title="复制全文"'
        + ' data-copy="' + escapeHtml(latest.text) + '">' + ICON_COPY + '</button>'
        + '</div>');
    }
    // 刚跑完的那条指令也要露出来（判据和为什么见 commandTail）。
    // 「正在执行」那块照旧：它是常驻的 #work，跟这里没关系。
    var tail = commandTail();
    if (tail) parts.push(commandBlock(tail));
    // 子智能体刚完工的那条通知同理（判据见 noticeTail）。它出现在这里的时机很窄——
    // 通知一到，父级通常会被唤醒作答，那条回答很快就会把它顶掉——但那一段空窗里
    // 屏幕上什么都不变的话，用户会以为子智能体那边没消息。
    var note = noticeTail();
    if (note) parts.push(noticeBlock(note));
    if (live) parts.push(liveBlock(live));
    if (parts.length) {
      var stick = atBottom();
      replyEl.innerHTML = parts.join('');
      // 流式的时候得跟着往下滚，不然新写出来的内容在屏幕外面，看起来像卡住了。
      // 但只在用户本来就在底部时才跟——他翻上去看历史的时候别拽他回来。
      if (live && stick) mainEl.scrollTop = mainEl.scrollHeight;
      // 单帧模式专属：**答案落定的那一刻**跳到顶部，让人从第一行开始读。
      //
      // 判据是 timestamp 变了，不是「渲染了一次」——重连、SSE 重推、切模式、
      // 从后台回来都会重新渲染同一条回答，那些时候用户可能正读到一半，
      // 弹回顶部比不跳还烦人（见 scrolledReplyAt 的说明）。
      //
      // 和上面那条黏底不冲突，两者管的是不同时刻：流式那会儿（live 还在）
      // 答案没落定，该跟着往下走；落定之后才轮到这一条把它拉回开头。
      // 也别跟下面 send() 里那条「按了发送无条件回底部」搞混——那是用户自己的
      // 主动动作，他想看自己刚发出去的那条；这条是回答到了，他要读回答。
      if (latest && latest.timestamp && latest.timestamp !== scrolledReplyAt) {
        scrolledReplyAt = latest.timestamp;
        mainEl.scrollTop = 0;
      }
      return;
    }
    if (state.running) {
      replyEl.innerHTML = '';
      return;
    }
    // 正在去读这个会话的记录：这时候说「在下面输入一条指令」是不对的——
    // 这个会话其实有历史，只是还没读完。单帧模式只显示最后一条回复，
    // 那一条也在这份记录里。
    if (state.historyLoading) {
      replyEl.innerHTML = '<div class="placeholder">正在读取这个会话的记录…</div>';
      return;
    }
    replyEl.innerHTML = '<div class="placeholder">在下面输入一条指令，'
      + '这里只会显示 AI 的最终回复。<br>中间的工具调用和执行过程不会传过来。</div>';
  }

  /**
   * 正在流出来的那一段。
   *
   * **刻意和答案画得不一样**：上面一条虚线，末尾一个一闪一闪的竖条，而且**没有
   * 复制按钮**。这三样都在说同一句话——「这不是最终答案，还会变」。等真正的答案
   * 落定，这一整块会被换掉。
   *
   * 为什么要区分得这么清楚：流式阶段拿不到完整内容，没法提前知道模型这一步会不会
   * 去调工具。服务端已经先用一小段「按兵不动」把绝大多数中间旁白挡在外面了
   * （见 lib/index.js 的 STREAM_GRACE_MS），但那是启发式、不是判据。万一漏过来
   * 一句旁白，它会被撤回——那时候用户看到的应该是「刚才那段是过程，不作数」，
   * 而不是「我的回答怎么没了」。
   */
  function liveBlock(text) {
    return '<div class="live"><div class="md">' + mdToHtml(text) + '</div></div>';
  }

  /**
   * 历史里的一条指令（`role:'command'`）：这个会话执行了 /xxx，跑到哪一步了。
   *
   * 为什么单独一种长相：它既不是用户说的话，也不是 AI 说的话，而是**会话做的一个
   * 动作**。套上气泡就成了一句人说的话，会被当成回答去读；给它复制按钮也没有意义
   * （「/compact 执行中…」没有拿走的必要）。所以收成一行紧凑的条目：名字用等宽字体，
   * 后面直接跟结果。
   *
   * 三种状态里只有 running 是「还不知道结果」：服务端在这一条上**不报进度**，
   * 所以只能说「执行中…」——编一个百分比就是撒谎。
   *
   * 这两个函数夹在 liveBlock 和 renderChat 中间是有原因的，**别挪**：page.test.mjs
   * 是按源码里的锚点串切片的——聊天模式那一套从 liveBlock 那一段切到 render 那一段，
   * 单帧模式那一套从 scrolledReplyAt 那一段切到 renderChat 那一段，两把刀的交集就是
   * 这里。放到交集外面，总有一套测试一跑就 ReferenceError。
   * （顺带一句：这段注释里**不能**写出那几个锚点串的完整样子，否则 indexOf 会先命中
   *   注释、把切片截断，报出来的是「SyntaxError」而不是人话。）
   */
  function commandBlock(m) {
    // args 是名字后面**原样**的输入（含分隔空格），可能为空串——所以直接拼，
    // 不自己补一个空格：补了就把「用户到底敲了什么」改样了。
    var line = '/' + (m.name || '') + (m.args || '');
    var kind = m.kind === 'error' ? 'error' : (m.kind === 'success' ? 'success' : 'running');
    var res = kind === 'error' ? (m.text || '没跑起来')
      : (kind === 'success' ? (m.text || '完成') : '执行中…');
    return '<div class="cmd ' + kind + '">'
      + '<span class="cmd-line">' + escapeHtml(line) + '</span>'
      + '<span class="cmd-res">' + escapeHtml(res) + '</span></div>';
  }

  /**
   * 单帧模式要跟着显示的那条指令：**历史里最后一条**，而且得真的是一条指令。
   *
   * 为什么要单独处理：单帧模式整屏只留最新一条回复，而指令**不产生回复**——用户点一下
   * /compact，这里要是什么都不画，屏幕上就是一动不动，看着像点了个没反应的按钮。
   *
   * 用「最后一条」而不是「最近一条指令」：中间要是夹了别的消息（指令跑完模型又答了
   * 一句），那条指令已经不是最新的事了，再把它贴在最下面就成了过期通知。
   *
   * 最后还有一道时间判断，别删。单帧模式的回答是走 SSE 的 reply 那条路来的，它
   * **不往 history 里塞东西**（只有聊天模式才塞），所以 history 的尾巴会一直停在那条
   * 指令上。不加这一道，新回答到了之后底下还挂着一条「执行中…」，看着像它卡住了。
   */
  function commandTail() {
    var h = state.history || [];
    var last = h.length ? h[h.length - 1] : null;
    if (!last || last.role !== 'command') return null;
    var lt = (state.latest && state.latest.timestamp) || 0;
    if (lt && last.timestamp && last.timestamp < lt) return null;
    return last;
  }

  /**
   * 一个会话 id 的「能区分人的那一段」。
   *
   * **不能直接取 id 的开头几位**：本机的会话 id 长这样 `session-80fd8f3c-…`，
   * 开头八位永远是 `session-`，一排子智能体就会全叫同一个名字。导航栏那边踩过
   * 同一个坑，page.test.mjs 里有一条守卫专门钉着它。所以先把 `session-` 这段
   * 人人相同的前缀去掉，再取一段开头——留下的才是真能区分它们的字符。
   */
  function shortSessionId(id) {
    var s = String(id || '');
    if (s.slice(0, 8) === 'session-') s = s.slice(8);
    if (!s) s = String(id || '');
    return s.slice(0, 8);
  }

  /**
   * 子智能体完工的那张卡片（聊天记录里的一种条目）。
   *
   * 它是**第三样东西**：不是用户说的话，也不是模型的回答，而是「这个会话派出去的
   * 一件事有结果了」。所以既不套用户气泡、也不画成回答正文——套上气泡就变成
   * 「我说过这句话」，混进正文又会被读成模型的话，两种都是假的。
   *
   * 展开/收起交给原生 `<details>`：不写一行脚本、不加一个关键帧，键盘和读屏也都认。
   *
   * 正文**原样贴出来**（`white-space: pre-wrap`，见 .sa-card .sa-body），不再解析：
   * 这段话是 DSH 生成的——它先说清「谁、为什么结束」，再把子智能体最后的原话接上。
   * 那是**转述**，不该由我们这边的渲染器再加工一遍。
   */
  function noticeBlock(m) {
    var who = m.senderSessionId ? shortSessionId(m.senderSessionId) : '';
    var when = m.timestamp ? timeLabel(m.timestamp) : '';
    return '<details class="sa-card"><summary><b>子智能体完工</b>'
      + (who ? '<span>' + escapeHtml(who) + '</span>' : '')
      + (when ? '<span>' + escapeHtml(when) + '</span>' : '')
      + '</summary><div class="sa-body">' + escapeHtml(m.text || '') + '</div></details>';
  }

  /**
   * 单帧模式要跟着显示的那条通知：**历史里最后一条**，而且得真的是一条通知。
   *
   * 判据和 commandTail 完全一样，连那道时间判断都照抄，理由也一样：
   *   - 用「最后一条」而不是「最近一条」：中间要是夹了别的消息（父级被唤醒后又答了
   *     一句），那条通知已经不是最新的事了，再贴在最下面就成了过期通知；
   *   - 单帧模式的回答走 SSE 的 reply 那条路，**不往 history 里塞**，所以 history
   *     的尾巴会一直停在那条通知上——不挡一下，新回答到了之后底下还挂着它。
   */
  function noticeTail() {
    var h = state.history || [];
    var last = h.length ? h[h.length - 1] : null;
    if (!last || last.role !== 'notice') return null;
    var lt = (state.latest && state.latest.timestamp) || 0;
    if (lt && last.timestamp && last.timestamp < lt) return null;
    return last;
  }

  /**
   * 该不该自动滚到底。
   *
   * 用户 2026-09-22 实机提的：「有动画的时候手机端页面运动到上面都会自动调回底部，
   * 这种机制没必要吧。」原来每次重画都无条件滚到底，而鲸鱼娘一帧一动、流式一秒七次，
   * 于是想往上翻根本翻不动——手一松就被拽回去。
   *
   * 改成只在**本来就在底部**的时候才跟着滚：新内容进来时视野跟着走，
   * 用户自己翻上去看历史时就不打扰他。
   *
   * 注意：这个判断必须在改 innerHTML **之前**做。改写内容本身会把滚动位置顶回去，
   * 改完再问「在不在底部」永远是「在」。
   */
  function atBottom() {
    // 48px 是「差不多到底了」的容差。手指滚动的惯性、地址栏收起都会差几个像素，
    // 卡得太死会变成「我明明就在底部，它却不跟着走了」。
    return mainEl.scrollHeight - mainEl.scrollTop - (mainEl.clientHeight || 0) < 48;
  }

  /**
   * 把某一块的**开头**对齐到视野顶部（聊天模式用，见 renderChat）。
   *
   * 用两个矩形的差值算，不用 `offsetTop`：`main` 上没有 `position: relative`，
   * `offsetTop` 会一路找到 body 去，算出来是错的。矩形差值不管定位上下文怎么变都对。
   *
   * 留 12px 空隙：`main` 自己带 16px 内边距，滚下去之后那段内边距就滚没了，
   * 不留缝的话回答的第一行会顶在屏幕最上沿，看着像被切掉了。
   */
  function pinToTop(el) {
    if (!el || typeof el.getBoundingClientRect !== 'function') return;
    if (typeof mainEl.getBoundingClientRect !== 'function') return;
    var gap = el.getBoundingClientRect().top - mainEl.getBoundingClientRect().top;
    // 这里**不用**为顶上那颗「往上滑看更早的」让高度：对齐开头只在「他本来就在底部」
    // 的时候做（见 scrollChat），而那时候那颗提示是收着的（见 chatNoteVisible）——
    // 让高度反而会凭空多出一段空白。
    mainEl.scrollTop += gap - 12;
  }

  /**
   * 聊天记录**一次铺多少条**，以及这次已经铺到多少条。
   *
   * 用户 2026-09-30 报的：在导航栏点一个没选中的会话，切过去很慢。查下来不是网络、
   * 也不是服务端取数（本机实测那三个接口 168 / 36 / 107 毫秒），而是这一页**一次把
   * 推上来的 200 条记录全铺出来**。这 200 条本来就已经在页面手里了——所以「往上多放
   * 一点」是个纯本地动作，不用再问服务端，也该是瞬时的。
   *
   * 40 这个数：一屏通常放得下三到五段长回答，40 条够铺六七屏；首屏只干五分之一的活，
   * 而往上翻的人一次也就看一屏，翻不到边界。
   */
  var CHAT_PAGE = 40;
  var chatWindow = CHAT_PAGE;   // 从最新那条往回数，这次铺了多少条
  var chatWindowFor = null;     // 上面这个数是哪个会话的（换会话要收回首屏，见 renderChat）
  var chatLoaded = 0;           // 本地一共有多少条可铺（滤掉排队那条之后），由 renderChat 记
  var chatGrowArmed = true;     // 这一轮靠近顶部已经放过一屏没有（见 maybeGrowChat）

  /** 触发线：离顶一屏的四分之一以内。放一屏和那颗提示共用这一条，别写成两个数。 */
  function chatEdge() {
    return Math.min(160, Math.max(60, (mainEl.clientHeight || 0) / 4));
  }

  /** 顶上那颗「往上滑看更早的」的元素（没铺出来就没有）。 */
  function moreNoteEl() {
    return replyEl.querySelector ? replyEl.querySelector('.more-note') : null;
  }

  /**
   * 那句提示现在该不该露脸：**近了顶部、又不在底部**。
   *
   * 两个条件缺一不可——
   *   · 离顶远了它就没用：再往上滑一下就自动放一屏，用不着它催；
   *   · 在底部时它必须收起来（用户 2026-09-30 真机提的那条）：那句话是催人往上滑的，
   *     人已经在最底下读内容了，它挂在那儿只剩挡视线。
   */
  function chatNoteVisible() {
    if (atBottom()) return false;
    return mainEl.scrollTop <= chatEdge();
  }

  /**
   * 把提示的露 / 收跟当前位置对齐。
   *
   * 这是**滚动时**的那一半。重画只在快照来的时候发生，而用户从中间一路滑到底
   * 是不会等快照的——不在滚动里收，那条提示就会一直挂在顶上（真机就是这么发现的）。
   */
  function paintChatNote() {
    var el = moreNoteEl();
    if (!el || !el.classList || typeof el.classList.toggle !== 'function') return;
    el.classList.toggle('hide', !chatNoteVisible());
  }

  function renderChat() {
    mainEl.classList.remove('center');
    // 换了会话就把窗口收回首屏：上一个会话铺到多少条都不该跟过来——那正是这次要修的慢。
    // 判据用会话 id 而不是 history 的引用：服务端每次推的都是整份新数组，比引用永远「变了」。
    if (chatWindowFor !== state.boundSessionId) {
      chatWindowFor = state.boundSessionId;
      chatWindow = CHAT_PAGE;
    }
    // **还在排队的那条不算「已发出」，这里要把它从聊天记录里滤掉。**
    //
    // 用户 2026-09-22 实机提的：「排队的指令在轮到之前不该出现在指令气泡里，
    // 就像发出去了一样，应该轮到再发出去。」
    //
    // 光在发送时不记账还不够。DSH 的一条排队消息可能被**领走一步、那一步又被驳回、
    // 于是退回队列**（dsh-agent 的原话：preserve queued and steering inbox items
    // instead of discarding them）。退回去的时候，早先那条「它开始跑了」的事件已经
    // 发过，聊天记录就此留下一笔——而队列里也还有它。实测抓到过同一个 id 两处都在。
    //
    // 所以判据不能是事件，得是**队列本身**：队列里有它，它就还没轮到。
    // 等它真跑起来、从队列里消失，这一笔自然就露出来了。
    var queuedIds = {};
    (state.queued || []).forEach(function (q) { if (q && q.id) queuedIds[q.id] = true; });
    var list = (state.history || []).filter(function (m) {
      return !(m.role === 'user' && m.id && queuedIds[m.id]);
    });
    // 先记「本地一共有多少条」再分支：下面那条「还没有对话记录」的路也要把数记成 0，
    // 不然中途清空一次（服务端正在重读）会留着一个旧的条数，让 maybeGrowChat 白忙一场。
    chatLoaded = list.length;
    if (!list.length && !state.running && !state.live && !(state.queued || []).length) {
      // 「正在读」和「确实没有」是两件事，分开说。点开一个插件没看过的会话时，
      // 服务端要去 DSH 的会话记录里读它那一段（最大的那条 20 MB、约半秒），
      // 这期间说「还没有对话记录」会让人以为这个会话本来就是空的。
      replyEl.innerHTML = state.historyLoading
        ? '<div class="placeholder">正在读取这个会话的记录…</div>'
        : '<div class="placeholder">还没有对话记录。</div>';
      return;
    }
    // **只铺最近那几十条**，剩下的留在手里等用户往上滑（来由见 CHAT_PAGE 那段）。
    // 切在**滤掉排队那条之后**：不然被滤掉的那条会白占一个名额。
    var older = Math.max(0, chatLoaded - chatWindow);
    if (older) list = list.slice(older);
    var html = list.map(function (m) {
      // 指令行：这是会话做的一个动作，不是谁说的话，单独一种长相——
      // 不套气泡、不给复制按钮（见 commandBlock 的说明）。
      if (m.role === 'command') return commandBlock(m);
      // 子智能体完工的通知：同一类「会话做的事」，画成一张可展开的卡片
      // （见 noticeBlock 的说明）。它没有复制按钮，也没有气泡。
      if (m.role === 'notice') return noticeBlock(m);
      // 被按停的那一轮：标一句，别让人以为模型答到一半断了。
      var stopped = m.interrupted ? '<span class="stopped">已停止</span>' : '';
      // 两种消息都给复制按钮。自己敲的指令也常有「再发一遍」「拿去别处用」的时候，
      // 原来只给 AI 气泡，用户反馈自己的话复制不了。
      var copyBtn = '<button class="copy" type="button" aria-label="复制" title="复制"'
        + ' data-copy="' + escapeHtml(m.text) + '">' + ICON_COPY + '</button>';
      if (m.role === 'user') {
        // 自己的指令：仍然是气泡，靠右。自己敲的是纯文本，不走 markdown——
        // 不然打几个星号就变样了。
        return '<div class="bubble user">' + linkify(m.text)
          + '<span class="meta">' + stopped + timeLabel(m.timestamp) + copyBtn + '</span></div>';
      }
      // AI 的回答：**不套气泡**（用户要求「参考单帧模式那样」）。
      // 于是一左一右、一个有框一个没框，正好分得清谁说的。
      return '<div class="said">'
        + (stopped ? '<div class="reply-bar">' + stopped + '</div>' : '')
        + '<div class="md">' + mdToHtml(m.text) + '</div>'
        + '<div class="reply-foot">' + copyBtn
        + '<span class="time">' + timeLabel(m.timestamp) + '</span></div></div>';
    }).join('');
    // 「上面还有，往上滑」要贴在**看得到的顶上**，而且**离顶远了就收起来**——
    // 两处讲究见 .more-note 的样式注释。露 / 收在这里先按当前位置定一次，
    // 之后由滚动里的 paintChatNote 接着跟。
    var moreNote = older
      ? '<div class="more-note' + (chatNoteVisible() ? '' : ' hide') + '">往上滑看更早的</div>'
      : '';
    // 「这不是全部」要说在**内容前面**：用户往上翻到顶时，第一眼看到的就是它，
    // 免得以为这个会话只有这么点内容。读历史有上限（见服务端 HISTORY_MAX_*）。
    if (state.historyTruncated) {
      html = '<div class="history-note">'
        + escapeHtml(state.historyNote || '这个会话很大，只显示了最近一段。')
        + '</div>' + html;
    }
    // 「正在执行」不再追加一个气泡——它是常驻的 #work，排在整串消息下面。
    // 两种模式共用同一块，改的时候两边都走一遍。
    if (state.live) html += liveBlock(state.live);
    // 先问「在不在底部」，再改内容——顺序反了永远是「在」（见 atBottom 的注释）。
    var stick = atBottom();
    replyEl.innerHTML = moreNote + html;
    scrollChat(stick);
  }

  /**
   * 往上滑到接近顶部，就再放一屏出来。
   *
   * 判据是「离顶部一屏的四分之一以内」，不要求真滑到 0：手机上惯性滚动会滑过头，
   * 卡在 0 反而要等一次回弹才触发。60 是下限（矮屏上四分之一太小，拇指一带就滑过），
   * 160 是上限（高屏上别放得太早，太早等于提前干了下一屏的活）。
   */
  function maybeGrowChat() {
    // 单帧模式那边也在往 main 上滚（回答落定要跳到页面顶端），别把那一下当成「他在往上翻」；
    // 本地都放完了也没什么可放的。
    if (state.mode !== 'chat' || chatLoaded <= 0) return;
    if (chatWindow >= chatLoaded) return;
    if (mainEl.scrollTop > chatEdge()) {
      // 滑下来了，这一轮重新装填：**一次靠近只放一屏**。
      // 不装填的话，万一位置校正没顶住（iOS 顶上那截橡皮筋会把人拽回 0），
      // 一次手势就能把 200 条连着放完——那正好把这个改动白做了。
      chatGrowArmed = true;
      return;
    }
    if (!chatGrowArmed) return;
    chatGrowArmed = false;
    growChat();
  }

  /** main 每一次滚动：先对齐那句提示的露 / 收，再看要不要再放一屏。 */
  function onMainScroll() {
    paintChatNote();
    maybeGrowChat();
  }

  /**
   * 往前多放一屏。纯本地动作：那些记录本来就在页面手里，不再问服务端。
   *
   * **放完必须立刻把位置校回来**，这是整件事最容易做坏的一步：往前面插内容，
   * 浏览器不会替你补偿，用户正看着的那一屏会被整个推下去一屏。
   *
   * 补偿用「离底部多远」：这次加的东西全在顶上，底部那一截一个字没动，
   * 所以只要这个距离不变，他眼前那几行就一格都不会走。别去量「原来那条消息」的
   * 矩形来对齐——重画是整块换 innerHTML，那条消息已经不在文档里了，量不着。
   */
  function growChat() {
    var fromBottom = mainEl.scrollHeight - mainEl.scrollTop;
    chatWindow += CHAT_PAGE;
    renderChat();
    mainEl.scrollTop = mainEl.scrollHeight - fromBottom;
  }

  /**
   * 聊天模式里「已经为哪一次回答把开头对齐到顶部」。
   *
   * 取值是 `'live'`（正在流的那一段）或 `'done:<timestamp>'`（落定的那条）。
   * 记这个是为了**每条回答只对齐一次**——不记的话，用户往下读的时候每次重画
   * 都会把他拽回开头，比不对齐还烦人。
   *
   * 声明放在这里而不是跟 scrolledReplyAt 作伴：page.test.mjs 是从 `liveBlock`
   * 切到 `render()` 来跑聊天模式的，放前面就切不进来，一跑就是 ReferenceError。
   */
  var pinnedAnswerKey = '';

  /**
   * 聊天模式的滚动：**回答的开头才是要读的地方，不是末尾。**
   *
   * 用户 2026-09-24 提的：「聊天模式下，回答出现时，页面也应该停留在回答的开头
   * 而非末尾，这样用户不用往上滚到开头」。
   *
   * 和单帧模式那条的区别：单帧只有一条回答，所以它对齐的是 0（页面顶端）；
   * 聊天模式有一串历史，要对齐的是**最新那条回答自己的开头**。
   *
   * 回答分两个阶段，各对齐一次（记号记在 pinnedAnswerKey 里）：
   *
   *   · **正在流**（live 非空）——对齐 `.live` 的开头，之后**不再跟底部**。
   *     这是关键的一条：流式每秒重画好几次，要是继续黏底，用户刚滚到开头
   *     就被拽回末尾，等于没改。
   *
   *   · **落定**（timestamp 变了）——对齐最后那条 `.said` 的开头，
   *     让最终版从第一行开始读。
   *
   * 为什么要记 key、而不是「每次都对齐」：用户往下读的时候，每次重画都把他拽回
   * 开头，比不对齐还烦人。这一点和单帧模式里 scrolledReplyAt 的道理是一样的。
   */
  function scrollChat(stick) {
    var liveNow = state.live || '';
    var newest = liveNow
      ? 'live'
      : (state.latest && state.latest.timestamp ? 'done:' + state.latest.timestamp : '');
    if (newest && newest !== pinnedAnswerKey) {
      // 先记账，再决定动不动他。记完就不再重复处理这条回答——
      // 用户往下读的时候被反复拉回开头，比不对齐还烦人。
      pinnedAnswerKey = newest;
      // **只在「他本来就在底部跟着看」的时候才动他。**
      //
      // 这一条不能省：用户 2026-09-22 实机提过「有动画的时候手机端页面运动到上面
      // 都会自动调回底部，这种机制没必要吧」。他要是自己翻上去看历史了，
      // 我们把他拽到回答开头，和当初拽回底部是同一类冒犯。
      //
      // 注意 stick 是**改 innerHTML 之前**问的（见 atBottom 的注释），
      // 所以它答的是「他刚才在不在底部」，正是这里要问的。
      if (!stick) return;
      var target = null;
      if (liveNow) {
        target = replyEl.querySelector ? replyEl.querySelector('.live') : null;
      } else if (replyEl.querySelectorAll) {
        var saids = replyEl.querySelectorAll('.said');
        target = saids.length ? saids[saids.length - 1] : null;
      }
      pinToTop(target);
      return;
